name: ci

on:
  push:
  pull_request:

jobs:
  python-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install API test dependencies
        run: python -m pip install -r apps/api/requirements.txt
      - name: Run contract tests
        run: PYTHONPATH=packages/geno_core:apps/api python -m unittest discover -s tests
