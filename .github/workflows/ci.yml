name: ci

on:
  push:
  pull_request:

jobs:
  contracts-and-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: |
            apps/web/package-lock.json
            apps/customer-web/package-lock.json
            apps/admin-web/package-lock.json
      - name: Install Python dev dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Install web dependencies
        run: |
          npm --prefix apps/customer-web ci
          npm --prefix apps/admin-web ci
      - name: Run static quality gates
        run: make quality
      - name: Run Python contract tests
        run: make test
      - name: Verify checked-in OpenAPI contract
        run: make openapi-contracts
      - name: Build Runtime Console
        run: make web-build
      - name: Validate Compose default config
        run: make docker-config
      - name: Validate Compose LLM gateway config
        run: make docker-config-llm
      - name: Validate Compose scheduler config
        run: make docker-config-scheduler
      - name: Validate Compose observability config
        run: make docker-config-observability
      - name: Validate Compose DB smoke config
        run: make docker-config-db-smoke
      - name: Run DB schema smoke
        run: make db-smoke
      - name: Validate Schema v2 Compose config
        run: make schema-v2-config
      - name: Run Schema v2 fresh-install gate
        run: make schema-v2-fresh-install
      - name: Run runtime E2E
        run: make runtime-e2e
