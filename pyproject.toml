[project]
name = "geo-platform"
version = "0.1.0"
description = "Evidence-first GEO monitoring and placement platform"
requires-python = ">=3.12,<3.13"
dependencies = [
  "alembic==1.14.1",
  "cryptography==45.0.5",
  "dramatiq[redis]==1.18.0",
  "fastapi==0.115.6",
  "httpx==0.28.1",
  "pypdf==5.9.0",
  "psycopg[binary]==3.3.4",
  "pydantic==2.12.4",
  "uvicorn[standard]==0.34.0",
  "geo-core",
]

[project.optional-dependencies]
f019-rag = [
    "llama-index-core==0.14.23",
]

[tool.uv.sources]
geo-core = { workspace = true }

[tool.uv.workspace]
members = ["packages/geo_core"]

[dependency-groups]
dev = [
  "mypy==1.15.0",
  "mistune==3.1.2",
  "playwright==1.60.0",
  "pytest==8.3.5",
  "pytest-cov==6.0.0",
  "pyyaml==6.0.2",
  "ruff==0.8.4",
  "types-pyyaml==6.0.12.20241230",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "apps/api", "packages/geo_core"]
markers = [
  "browser: requires a browser runtime",
  "integration: requires PostgreSQL or other runtime services",
  "live: performs paid or externally visible provider calls",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.12"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
check_untyped_defs = true
