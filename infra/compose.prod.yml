name: geo-production

x-service-security: &service-security
  restart: unless-stopped
  init: true
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

x-api-common-environment: &api-common-environment
  GEO_DEPLOYMENT_ENVIRONMENT: production
  GEO_RELEASE_VERSION: ${GEO_RELEASE_VERSION:?set GEO_RELEASE_VERSION}
  GEO_DEV_TOOLS_ENABLED: "0"
  GEO_DB_POOL_ENABLED: "1"
  GEO_DB_POOL_MAX_SIZE: "10"
  GEO_DATABASE_URL_FILE: /run/secrets/database_url
  GEO_READINESS_DEPENDENCY_TIMEOUT_SECONDS: ${GEO_READINESS_DEPENDENCY_TIMEOUT_SECONDS:-2}
  GEO_READINESS_TOTAL_TIMEOUT_SECONDS: ${GEO_READINESS_TOTAL_TIMEOUT_SECONDS:-5}

x-internal-api-environment: &internal-api-environment
  <<: *api-common-environment
  GEO_AUTH_MODE: oidc
  GEO_OIDC_DISCOVERY_URL: ${GEO_OIDC_DISCOVERY_URL:?set GEO_OIDC_DISCOVERY_URL}
  GEO_JWT_ISSUER: ${GEO_JWT_ISSUER:?set GEO_JWT_ISSUER}
  GEO_JWT_AUDIENCE: ${GEO_JWT_AUDIENCE:?set GEO_JWT_AUDIENCE}
  GEO_AUTH_TOKEN_SECRET_FILE: /run/secrets/auth_token_secret
  OBJECT_STORE_ENDPOINT: http://minio:9000
  OBJECT_STORE_BUCKET: geo-artifacts
  OBJECT_STORE_REGION: ${GEO_OBJECT_STORE_REGION:-us-east-1}
  OBJECT_STORE_ACCESS_KEY_FILE: /run/secrets/object_store_access_key
  OBJECT_STORE_SECRET_KEY_FILE: /run/secrets/object_store_secret_key
  OBJECT_STORE_AUTO_CREATE_BUCKET: "0"
  GEO_TASK_QUEUE_ENABLED: "1"
  GEO_TASK_QUEUE_REQUIRED: "1"
  GEO_TASK_QUEUE_BROKER_URL: redis://valkey:6379/0
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
  OTEL_SERVICE_NAME: geo-internal-api

x-customer-api-environment: &customer-api-environment
  <<: *api-common-environment
  GEO_AUTH_MODE: session
  GEO_AUTH_TOKEN_SECRET_FILE: /run/secrets/auth_token_secret
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
  OTEL_SERVICE_NAME: geo-customer-api

x-internal-api-secrets: &internal-api-secrets
  - database_url
  - object_store_access_key
  - object_store_secret_key
  - auth_token_secret

x-customer-api-secrets: &customer-api-secrets
  - database_url
  - auth_token_secret

x-internal-dependencies: &internal-dependencies
  migrate:
    condition: service_completed_successfully
  minio-bootstrap:
    condition: service_completed_successfully
  valkey:
    condition: service_healthy

x-customer-dependencies: &customer-dependencies
  migrate:
    condition: service_completed_successfully

x-relay-dependencies: &relay-dependencies
  migrate:
    condition: service_completed_successfully
  valkey:
    condition: service_healthy

services:
  postgres:
    <<: *service-security
    image: ${GEO_POSTGRES_IMAGE:?set a digest-pinned GEO_POSTGRES_IMAGE}
    environment:
      POSTGRES_DB: geo
      POSTGRES_USER: geo_installer
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_installer_password
    secrets:
      - postgres_installer_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U geo_installer -d geo"]
      interval: 10s
      timeout: 5s
      retries: 12
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 4G

  migrate:
    <<: *service-security
    image: ${GEO_API_IMAGE:?set a digest-pinned GEO_API_IMAGE}
    restart: "no"
    read_only: true
    tmpfs:
      - /tmp:size=128m,noexec,nosuid
    environment:
      DATABASE_URL_FILE: /run/secrets/installer_database_url
    secrets:
      - installer_database_url
    command: ["alembic", "-c", "/app/alembic.ini", "upgrade", "head"]
    networks:
      - backend
    depends_on:
      postgres:
        condition: service_healthy

  minio:
    <<: *service-security
    image: ${GEO_MINIO_IMAGE:?set a digest-pinned GEO_MINIO_IMAGE}
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER_FILE: /run/secrets/minio_root_user
      MINIO_ROOT_PASSWORD_FILE: /run/secrets/minio_root_password
    secrets:
      - minio_root_user
      - minio_root_password
    volumes:
      - minio_data:/data
    networks:
      - backend
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 12
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 2G

  minio-bootstrap:
    <<: *service-security
    image: ${GEO_MINIO_MC_IMAGE:?set a digest-pinned GEO_MINIO_MC_IMAGE}
    restart: "no"
    entrypoint: ["/bin/sh", "/bootstrap/bootstrap.sh"]
    environment:
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ROOT_USER_FILE: /run/secrets/minio_root_user
      MINIO_ROOT_PASSWORD_FILE: /run/secrets/minio_root_password
      OBJECT_STORE_BUCKET: geo-artifacts
      OBJECT_STORE_BACKUP_BUCKET: geo-backups
      OBJECT_STORE_ACCESS_KEY_FILE: /run/secrets/object_store_access_key
      OBJECT_STORE_SECRET_KEY_FILE: /run/secrets/object_store_secret_key
      OBJECT_STORE_BACKUP_ACCESS_KEY_FILE: /run/secrets/object_store_backup_access_key
      OBJECT_STORE_BACKUP_SECRET_KEY_FILE: /run/secrets/object_store_backup_secret_key
      OBJECT_STORE_RESTORE_ACCESS_KEY_FILE: /run/secrets/object_store_restore_access_key
      OBJECT_STORE_RESTORE_SECRET_KEY_FILE: /run/secrets/object_store_restore_secret_key
      OBJECT_STORE_RETENTION_ACCESS_KEY_FILE: /run/secrets/object_store_retention_access_key
      OBJECT_STORE_RETENTION_SECRET_KEY_FILE: /run/secrets/object_store_retention_secret_key
      MINIO_BOOTSTRAP_ENABLE_EPHEMERAL: "0"
      MINIO_POLICY_VERSION: geo-object-store-policy-v1
    secrets:
      - minio_root_user
      - minio_root_password
      - object_store_access_key
      - object_store_secret_key
      - object_store_backup_access_key
      - object_store_backup_secret_key
      - object_store_restore_access_key
      - object_store_restore_secret_key
      - object_store_retention_access_key
      - object_store_retention_secret_key
    volumes:
      - ./minio:/bootstrap:ro
    networks:
      - backend
    depends_on:
      minio:
        condition: service_healthy

  valkey:
    <<: *service-security
    image: ${GEO_VALKEY_IMAGE:?set a digest-pinned GEO_VALKEY_IMAGE}
    command: ["valkey-server", "--appendonly", "yes", "--save", "60", "1000"]
    volumes:
      - valkey_data:/data
    networks:
      - backend
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 12

  internal-api:
    <<: *service-security
    image: ${GEO_API_IMAGE:?set a digest-pinned GEO_API_IMAGE}
    read_only: true
    tmpfs:
      - /tmp:size=256m,noexec,nosuid
    environment:
      <<: *internal-api-environment
    secrets: *internal-api-secrets
    command: ["uvicorn", "geo_api.internal_app:app", "--host", "0.0.0.0", "--port", "8000"]
    networks:
      - backend
      - egress
    depends_on: *internal-dependencies
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready', timeout=5).read()"]
      interval: 10s
      timeout: 5s
      retries: 12

  customer-api:
    <<: *service-security
    image: ${GEO_API_IMAGE:?set a digest-pinned GEO_API_IMAGE}
    read_only: true
    tmpfs:
      - /tmp:size=256m,noexec,nosuid
    environment:
      <<: *customer-api-environment
    secrets: *customer-api-secrets
    command: ["uvicorn", "geo_api.customer_app:app", "--host", "0.0.0.0", "--port", "8000"]
    networks:
      - backend
    depends_on: *customer-dependencies
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready', timeout=5).read()"]
      interval: 10s
      timeout: 5s
      retries: 12

  task-worker:
    <<: *service-security
    image: ${GEO_API_IMAGE:?set a digest-pinned GEO_API_IMAGE}
    read_only: true
    tmpfs:
      - /tmp:size=512m,noexec,nosuid
    environment:
      GEO_DEPLOYMENT_ENVIRONMENT: production
      GEO_RELEASE_VERSION: ${GEO_RELEASE_VERSION:?set GEO_RELEASE_VERSION}
      GEO_DATABASE_URL_FILE: /run/secrets/worker_database_url
      GEO_TASK_QUEUE_BROKER_URL: redis://valkey:6379/0
      GEO_RUNTIME_HEARTBEAT_INTERVAL_SECONDS: ${GEO_RUNTIME_HEARTBEAT_INTERVAL_SECONDS:-10}
      GEO_RUNTIME_HEARTBEAT_STALE_SECONDS: ${GEO_RUNTIME_HEARTBEAT_STALE_SECONDS:-30}
      GEO_RUNTIME_QUEUED_STALE_SECONDS: ${GEO_RUNTIME_QUEUED_STALE_SECONDS:-600}
      GEO_RUNTIME_OUTBOX_STALE_SECONDS: ${GEO_RUNTIME_OUTBOX_STALE_SECONDS:-300}
      GEO_RUNTIME_RUNNING_GRACE_SECONDS: ${GEO_RUNTIME_RUNNING_GRACE_SECONDS:-60}
      GEO_RUNTIME_FAILURE_WINDOW_SECONDS: ${GEO_RUNTIME_FAILURE_WINDOW_SECONDS:-86400}
      GEO_RUNTIME_EXPECTED_TASK_WORKER_INSTANCES: ${GEO_RUNTIME_EXPECTED_TASK_WORKER_INSTANCES:-2}
      GEO_DEEPSEEK_API_KEY_FILE: /run/secrets/deepseek_api_key
      OBJECT_STORE_ENDPOINT: http://minio:9000
      OBJECT_STORE_BUCKET: geo-artifacts
      OBJECT_STORE_REGION: ${GEO_OBJECT_STORE_REGION:-us-east-1}
      OBJECT_STORE_ACCESS_KEY_FILE: /run/secrets/object_store_access_key
      OBJECT_STORE_SECRET_KEY_FILE: /run/secrets/object_store_secret_key
      OBJECT_STORE_AUTO_CREATE_BUCKET: "0"
      OTEL_SERVICE_NAME: geo-task-worker
    secrets:
      - worker_database_url
      - deepseek_api_key
      - object_store_access_key
      - object_store_secret_key
    command: ["dramatiq", "geo_worker.tasks", "--processes", "2", "--threads", "4"]
    networks:
      - backend
      - egress
    depends_on: *internal-dependencies
    healthcheck:
      test: ["CMD", "python", "-m", "geo_worker.runtime_health", "heartbeat", "--service-type", "task_worker"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

  outbox-relay:
    <<: *service-security
    image: ${GEO_API_IMAGE:?set a digest-pinned GEO_API_IMAGE}
    read_only: true
    tmpfs:
      - /tmp:size=128m,noexec,nosuid
    environment:
      GEO_DEPLOYMENT_ENVIRONMENT: production
      GEO_RELEASE_VERSION: ${GEO_RELEASE_VERSION:?set GEO_RELEASE_VERSION}
      GEO_DATABASE_URL_FILE: /run/secrets/worker_database_url
      GEO_TASK_QUEUE_BROKER_URL: redis://valkey:6379/0
      GEO_RUNTIME_HEARTBEAT_INTERVAL_SECONDS: ${GEO_RUNTIME_HEARTBEAT_INTERVAL_SECONDS:-10}
      GEO_RUNTIME_HEARTBEAT_STALE_SECONDS: ${GEO_RUNTIME_HEARTBEAT_STALE_SECONDS:-30}
      GEO_RUNTIME_QUEUED_STALE_SECONDS: ${GEO_RUNTIME_QUEUED_STALE_SECONDS:-600}
      GEO_RUNTIME_OUTBOX_STALE_SECONDS: ${GEO_RUNTIME_OUTBOX_STALE_SECONDS:-300}
      GEO_RUNTIME_RUNNING_GRACE_SECONDS: ${GEO_RUNTIME_RUNNING_GRACE_SECONDS:-60}
      GEO_RUNTIME_FAILURE_WINDOW_SECONDS: ${GEO_RUNTIME_FAILURE_WINDOW_SECONDS:-86400}
      GEO_RUNTIME_EXPECTED_OUTBOX_RELAY_INSTANCES: ${GEO_RUNTIME_EXPECTED_OUTBOX_RELAY_INSTANCES:-1}
      OTEL_SERVICE_NAME: geo-outbox-relay
    secrets:
      - worker_database_url
    command: ["python", "-m", "geo_worker.relay"]
    networks:
      - backend
    depends_on: *relay-dependencies
    healthcheck:
      test: ["CMD", "python", "-m", "geo_worker.runtime_health", "heartbeat", "--service-type", "outbox_relay"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

  admin-web:
    <<: *service-security
    image: ${GEO_ADMIN_WEB_IMAGE:?set a digest-pinned GEO_ADMIN_WEB_IMAGE}
    read_only: true
    tmpfs:
      - /tmp:size=128m,noexec,nosuid
    environment:
      API_INTERNAL_BASE_URL: http://internal-api:8000
      GEO_DEPLOYMENT_ENVIRONMENT: production
      GEO_RELEASE_VERSION: ${GEO_RELEASE_VERSION:?set GEO_RELEASE_VERSION}
      CUSTOMER_WEB_BASE_URL: ${GEO_CUSTOMER_WEB_BASE_URL:?set GEO_CUSTOMER_WEB_BASE_URL}
      GEO_ADMIN_OIDC_LOGIN_URL: ${GEO_ADMIN_OIDC_LOGIN_URL:?set GEO_ADMIN_OIDC_LOGIN_URL}
      GEO_ADMIN_OIDC_LOGOUT_URL: ${GEO_ADMIN_OIDC_LOGOUT_URL:?set GEO_ADMIN_OIDC_LOGOUT_URL}
      GEO_ADMIN_OIDC_ALLOWED_ORIGINS: ${GEO_ADMIN_OIDC_ALLOWED_ORIGINS:?set GEO_ADMIN_OIDC_ALLOWED_ORIGINS}
      PORT: "3000"
    ports:
      - "127.0.0.1:${GEO_ADMIN_WEB_HOST_PORT:-3001}:3000"
    networks:
      - backend
      - edge
    depends_on:
      internal-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12

  customer-web:
    <<: *service-security
    image: ${GEO_CUSTOMER_WEB_IMAGE:?set a digest-pinned GEO_CUSTOMER_WEB_IMAGE}
    read_only: true
    tmpfs:
      - /tmp:size=128m,noexec,nosuid
    environment:
      API_CUSTOMER_BASE_URL: http://customer-api:8000
      GEO_DEPLOYMENT_ENVIRONMENT: production
      GEO_RELEASE_VERSION: ${GEO_RELEASE_VERSION:?set GEO_RELEASE_VERSION}
      ADMIN_WEB_BASE_URL: ${GEO_ADMIN_WEB_BASE_URL:?set GEO_ADMIN_WEB_BASE_URL}
      PORT: "3000"
    ports:
      - "127.0.0.1:${GEO_CUSTOMER_WEB_HOST_PORT:-3000}:3000"
    networks:
      - backend
      - edge
    depends_on:
      customer-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12

  initial-owner-provision:
    <<: *service-security
    image: ${GEO_API_IMAGE:?set a digest-pinned GEO_API_IMAGE}
    profiles: ["provisioning"]
    restart: "no"
    read_only: true
    tmpfs:
      - /tmp:size=32m,noexec,nosuid
    environment:
      GEO_INSTALLER_DATABASE_URL_FILE: /run/secrets/installer_database_url
      GEO_JWT_ISSUER: ${GEO_JWT_ISSUER:?set GEO_JWT_ISSUER}
      GEO_BOOTSTRAP_TENANT_ID: ${GEO_BOOTSTRAP_TENANT_ID:-}
      GEO_BOOTSTRAP_TENANT_NAME: ${GEO_BOOTSTRAP_TENANT_NAME:-}
      GEO_BOOTSTRAP_OIDC_ISSUER: ${GEO_BOOTSTRAP_OIDC_ISSUER:-}
      GEO_BOOTSTRAP_OIDC_SUBJECT: ${GEO_BOOTSTRAP_OIDC_SUBJECT:-}
      GEO_BOOTSTRAP_EMAIL: ${GEO_BOOTSTRAP_EMAIL:-}
      GEO_BOOTSTRAP_DISPLAY_NAME: ${GEO_BOOTSTRAP_DISPLAY_NAME:-}
      GEO_BOOTSTRAP_PROJECT_ID: ${GEO_BOOTSTRAP_PROJECT_ID:-}
      GEO_BOOTSTRAP_PROJECT_NAME: ${GEO_BOOTSTRAP_PROJECT_NAME:-}
    secrets:
      - installer_database_url
    command: ["python", "-m", "scripts.provision_initial_owner"]
    networks:
      - backend
    depends_on:
      migrate:
        condition: service_completed_successfully

  otel-collector:
    <<: *service-security
    image: ${GEO_OTEL_COLLECTOR_IMAGE:?set a digest-pinned GEO_OTEL_COLLECTOR_IMAGE}
    profiles: ["observability"]
    command: ["--config=/etc/otelcol/config.yml"]
    volumes:
      - ./otel/collector.yml:/etc/otelcol/config.yml:ro
    networks:
      - backend

  backup-object-store:
    <<: *service-security
    image: ${GEO_MINIO_MC_IMAGE:?set a digest-pinned GEO_MINIO_MC_IMAGE}
    profiles: ["backup"]
    restart: "no"
    entrypoint: ["/bin/sh", "/backup/backup-object-store.sh"]
    environment:
      MINIO_ENDPOINT: http://minio:9000
      BACKUP_STAMP: ${BACKUP_STAMP:-manual}
      OBJECT_STORE_BACKUP_ACCESS_KEY_FILE: /run/secrets/object_store_backup_access_key
      OBJECT_STORE_BACKUP_SECRET_KEY_FILE: /run/secrets/object_store_backup_secret_key
    secrets:
      - object_store_backup_access_key
      - object_store_backup_secret_key
    volumes:
      - ./backup:/backup:ro
      - ${GEO_BACKUP_ROOT:?set GEO_BACKUP_ROOT}:/backup-data
    networks:
      - backend

  restore-smoke-postgres:
    <<: *service-security
    image: ${GEO_POSTGRES_IMAGE:?set a digest-pinned GEO_POSTGRES_IMAGE}
    profiles: ["restore-smoke"]
    restart: "no"
    environment:
      POSTGRES_DB: geo_restore_smoke
      POSTGRES_USER: geo_restore
      POSTGRES_PASSWORD_FILE: /run/secrets/restore_smoke_password
    secrets:
      - restore_smoke_password
    tmpfs:
      - /var/lib/postgresql/data:size=2g
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U geo_restore -d geo_restore_smoke"]
      interval: 3s
      timeout: 3s
      retries: 20

networks:
  backend:
    internal: true
  egress:
  edge:

volumes:
  postgres_data:
  minio_data:
  valkey_data:

secrets:
  postgres_installer_password:
    file: ${GEO_POSTGRES_INSTALLER_PASSWORD_FILE:?set GEO_POSTGRES_INSTALLER_PASSWORD_FILE}
  installer_database_url:
    file: ${GEO_INSTALLER_DATABASE_URL_FILE:?set GEO_INSTALLER_DATABASE_URL_FILE}
  database_url:
    file: ${GEO_DATABASE_URL_FILE:?set GEO_DATABASE_URL_FILE}
  worker_database_url:
    file: ${GEO_WORKER_DATABASE_URL_FILE:?set GEO_WORKER_DATABASE_URL_FILE}
  minio_root_user:
    file: ${GEO_MINIO_ROOT_USER_FILE:?set GEO_MINIO_ROOT_USER_FILE}
  minio_root_password:
    file: ${GEO_MINIO_ROOT_PASSWORD_FILE:?set GEO_MINIO_ROOT_PASSWORD_FILE}
  object_store_access_key:
    file: ${GEO_OBJECT_STORE_ACCESS_KEY_FILE:?set GEO_OBJECT_STORE_ACCESS_KEY_FILE}
  object_store_secret_key:
    file: ${GEO_OBJECT_STORE_SECRET_KEY_FILE:?set GEO_OBJECT_STORE_SECRET_KEY_FILE}
  object_store_backup_access_key:
    file: ${GEO_OBJECT_STORE_BACKUP_ACCESS_KEY_FILE:?set GEO_OBJECT_STORE_BACKUP_ACCESS_KEY_FILE}
  object_store_backup_secret_key:
    file: ${GEO_OBJECT_STORE_BACKUP_SECRET_KEY_FILE:?set GEO_OBJECT_STORE_BACKUP_SECRET_KEY_FILE}
  object_store_restore_access_key:
    file: ${GEO_OBJECT_STORE_RESTORE_ACCESS_KEY_FILE:?set GEO_OBJECT_STORE_RESTORE_ACCESS_KEY_FILE}
  object_store_restore_secret_key:
    file: ${GEO_OBJECT_STORE_RESTORE_SECRET_KEY_FILE:?set GEO_OBJECT_STORE_RESTORE_SECRET_KEY_FILE}
  object_store_retention_access_key:
    file: ${GEO_OBJECT_STORE_RETENTION_ACCESS_KEY_FILE:?set GEO_OBJECT_STORE_RETENTION_ACCESS_KEY_FILE}
  object_store_retention_secret_key:
    file: ${GEO_OBJECT_STORE_RETENTION_SECRET_KEY_FILE:?set GEO_OBJECT_STORE_RETENTION_SECRET_KEY_FILE}
  deepseek_api_key:
    file: ${GEO_DEEPSEEK_API_KEY_FILE:?set GEO_DEEPSEEK_API_KEY_FILE}
  auth_token_secret:
    file: ${GEO_AUTH_TOKEN_SECRET_FILE:?set GEO_AUTH_TOKEN_SECRET_FILE}
  restore_smoke_password:
    file: ${GEO_RESTORE_SMOKE_PASSWORD_FILE:?set GEO_RESTORE_SMOKE_PASSWORD_FILE}
