      GEO_SECRET_STORE_REQUEST_HASH_KEY_FILE: /run/secrets/secret_store_request_hash_key
      GEO_PROVIDER_ARTIFACT_KEYRING_FILE: /run/secrets/provider_artifact_keyring
      GEO_SYNTHETIC_ARTIFACT_KEYRING_FILE: /run/secrets/synthetic_artifact_keyring
      GEO_RECOMMENDATION_ARTIFACT_KEYRING_FILE: /run/secrets/recommendation_artifact_keyring
      GEO_WORKFLOW_C_ARTIFACT_KEYRING_FILE: /run/secrets/workflow_c_artifact_keyring
      GEO_RESTORE_PROBE_SERVICE_IDENTITY_ID: ${GEO_RESTORE_PROBE_SERVICE_IDENTITY_ID:?set GEO_RESTORE_PROBE_SERVICE_IDENTITY_ID}
      GEO_RESTORE_SECRET_REFERENCE_ID: ${GEO_RESTORE_SECRET_REFERENCE_ID:?set GEO_RESTORE_SECRET_REFERENCE_ID}
      GEO_RESTORE_SECRET_PROJECT_ID: ${GEO_RESTORE_SECRET_PROJECT_ID:?set GEO_RESTORE_SECRET_PROJECT_ID}
      GEO_RESTORE_SECRET_PURPOSE: ${GEO_RESTORE_SECRET_PURPOSE:?set GEO_RESTORE_SECRET_PURPOSE}
      GEO_RESTORE_SECRET_VERSION: ${GEO_RESTORE_SECRET_VERSION:?set GEO_RESTORE_SECRET_VERSION}
      GEO_RESTORE_SECRET_IDEMPOTENCY_KEY: ${GEO_RESTORE_SECRET_IDEMPOTENCY_KEY:?set GEO_RESTORE_SECRET_IDEMPOTENCY_KEY}
    secrets:
      - restore_smoke_password
      - secret_store_master_keyring
      - secret_store_request_hash_key
      - provider_artifact_keyring
      - synthetic_artifact_keyring
      - recommendation_artifact_keyring
      - workflow_c_artifact_keyring
    command:
      - python
      - -m
      - geo_worker.backup_restore_probe
      - --database-password-file
      - /run/secrets/restore_smoke_password
      - --database-host
      - restore-smoke-postgres
      - --database-user
      - geo_restore
      - --database-name
      - geo_restore_smoke
      - --secret-store-keyring
      - /run/secrets/secret_store_master_keyring
      - --secret-store-request-hash-key
      - /run/secrets/secret_store_request_hash_key
      - --secret-store-service-identity-id
      - ${GEO_RESTORE_PROBE_SERVICE_IDENTITY_ID:?set GEO_RESTORE_PROBE_SERVICE_IDENTITY_ID}
      - --secret-store-frozen-reference-id
      - ${GEO_RESTORE_SECRET_REFERENCE_ID:?set GEO_RESTORE_SECRET_REFERENCE_ID}
      - --secret-store-frozen-project-id
      - ${GEO_RESTORE_SECRET_PROJECT_ID:?set GEO_RESTORE_SECRET_PROJECT_ID}
      - --secret-store-frozen-purpose
      - ${GEO_RESTORE_SECRET_PURPOSE:?set GEO_RESTORE_SECRET_PURPOSE}
      - --secret-store-frozen-version
      - ${GEO_RESTORE_SECRET_VERSION:?set GEO_RESTORE_SECRET_VERSION}
      - --secret-store-resolve-idempotency-key
      - ${GEO_RESTORE_SECRET_IDEMPOTENCY_KEY:?set GEO_RESTORE_SECRET_IDEMPOTENCY_KEY}
      - --provider-artifact-keyring
      - /run/secrets/provider_artifact_keyring
      - --synthetic-artifact-keyring
      - /run/secrets/synthetic_artifact_keyring
      - --recommendation-artifact-keyring
      - /run/secrets/recommendation_artifact_keyring
      - --workflow-c-artifact-keyring
      - /run/secrets/workflow_c_artifact_keyring
      - --object-root
      - /restore-objects
      - --object-bucket
      - geo-artifacts
      - --recommendation-object-root
      - /restore-recommendation-objects
      - --recommendation-object-bucket
      - geo-restricted-recommendation-artifacts
      - --workflow-c-object-root
      - /restore-workflow-c-objects
      - --workflow-c-object-bucket
      - geo-restricted-workflow-c-artifacts
      - --synthetic-raw-object-root
      - /restore-synthetic-style-raw-objects
      - --synthetic-raw-object-bucket
      - geo-synthetic-style-raw
      - --synthetic-derived-object-root
      - /restore-synthetic-style-derived-objects
      - --synthetic-derived-object-bucket
      - geo-synthetic-style-derived
    networks:
      - backend
    depends_on:
      restore-smoke-postgres:
        condition: service_healthy

