name: geo-production

x-service-security: &service-security
  restart: unless-stopped
  init: true
  pids_limit: 512
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "3"
  deploy:
    resources:
      limits:
        cpus: "0.5"
        memory: 512M
        pids: 512

x-api-common-environment: &api-common-environment
  GEO_DEPLOYMENT_ENVIRONMENT: production
  GEO_RELEASE_VERSION: ${GEO_RELEASE_VERSION:?set GEO_RELEASE_VERSION}
  GEO_RELEASE_COMMIT: ${GEO_RELEASE_COMMIT:?set the current 40-character Git commit}
  GEO_DEV_TOOLS_ENABLED: "0"
  GEO_DB_POOL_ENABLED: "1"
  GEO_DB_POOL_MAX_SIZE: "10"
  GEO_DATABASE_URL_FILE: /run/secrets/database_url
  GEO_READINESS_DEPENDENCY_TIMEOUT_SECONDS: ${GEO_READINESS_DEPENDENCY_TIMEOUT_SECONDS:-2}
  GEO_READINESS_TOTAL_TIMEOUT_SECONDS: ${GEO_READINESS_TOTAL_TIMEOUT_SECONDS:-5}

x-internal-api-environment: &internal-api-environment
  <<: *api-common-environment
  GEO_AUTH_MODE: oidc
  GEO_OIDC_DISCOVERY_URL: ${GEO_OIDC_DISCOVERY_URL:?set GEO_OIDC_DISCOVERY_URL}
  GEO_JWT_ISSUER: ${GEO_JWT_ISSUER:?set GEO_JWT_ISSUER}
  GEO_JWT_AUDIENCE: ${GEO_JWT_AUDIENCE:?set GEO_JWT_AUDIENCE}
  GEO_AUTH_TOKEN_SECRET_FILE: /run/secrets/auth_token_secret
  GEO_SECRET_STORE_MASTER_KEYRING_FILE: /run/secrets/secret_store_master_keyring
  GEO_SECRET_STORE_REQUEST_HASH_KEY_FILE: /run/secrets/secret_store_request_hash_key
  GEO_WORKFLOW_C_ARTIFACT_KEYRING_FILE: /run/secrets/workflow_c_artifact_keyring
  GEO_WORKFLOW_C_ARTIFACT_OBJECT_STORE_ENDPOINT: http://minio:9000
  GEO_WORKFLOW_C_ARTIFACT_OBJECT_STORE_BUCKET: geo-restricted-workflow-c-artifacts
  GEO_WORKFLOW_C_ARTIFACT_OBJECT_STORE_ACCESS_KEY_FILE: /run/secrets/workflow_c_artifact_object_store_access_key
  GEO_WORKFLOW_C_ARTIFACT_OBJECT_STORE_SECRET_KEY_FILE: /run/secrets/workflow_c_artifact_object_store_secret_key
  GEO_WORKFLOW_C_ARTIFACT_OBJECT_STORE_REGION: ${GEO_OBJECT_STORE_REGION:-us-east-1}
  OBJECT_STORE_ENDPOINT: http://minio:9000
  OBJECT_STORE_BUCKET: geo-artifacts
  OBJECT_STORE_REGION: ${GEO_OBJECT_STORE_REGION:-us-east-1}
  OBJECT_STORE_ACCESS_KEY_FILE: /run/secrets/object_store_access_key
  OBJECT_STORE_SECRET_KEY_FILE: /run/secrets/object_store_secret_key
  OBJECT_STORE_AUTO_CREATE_BUCKET: "0"
  GEO_TASK_QUEUE_ENABLED: "1"
  GEO_TASK_QUEUE_REQUIRED: "1"
  GEO_TASK_QUEUE_BROKER_URL: redis://valkey:6379/0
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
  OTEL_SERVICE_NAME: geo-internal-api

x-customer-api-environment: &customer-api-environment
  <<: *api-common-environment
  GEO_AUTH_MODE: session
  GEO_AUTH_TOKEN_SECRET_FILE: /run/secrets/auth_token_secret
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
  OTEL_SERVICE_NAME: geo-customer-api

x-internal-api-secrets: &internal-api-secrets
  - database_url
  - object_store_access_key
  - object_store_secret_key
  - auth_token_secret
  - secret_store_master_keyring
  - secret_store_request_hash_key
  - workflow_c_artifact_keyring
  - workflow_c_artifact_object_store_access_key
  - workflow_c_artifact_object_store_secret_key

x-customer-api-secrets: &customer-api-secrets
  - database_url
  - auth_token_secret

x-internal-dependencies: &internal-dependencies
  migrate:
    condition: service_completed_successfully
  minio-bootstrap:
    condition: service_completed_successfully
  valkey:
    condition: service_healthy

x-customer-dependencies: &customer-dependencies
  migrate:
    condition: service_completed_successfully

x-relay-dependencies: &relay-dependencies
  migrate:
    condition: service_completed_successfully
  valkey:
    condition: service_healthy

services:
  postgres:
    <<: *service-security
    image: ${GEO_POSTGRES_IMAGE:?set a digest-pinned GEO_POSTGRES_IMAGE}
    environment:
      POSTGRES_DB: geo
      POSTGRES_USER: geo_installer
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_installer_password
    secrets:
      - postgres_installer_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U geo_installer -d geo"]
      interval: 10s
      timeout: 5s
      retries: 12
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 4G
          pids: 512

  migrate:
    <<: *service-security
    image: ${GEO_API_IMAGE:?set a digest-pinned GEO_API_IMAGE}
    restart: "no"
    read_only: true
    tmpfs:
      - /tmp:size=128m,noexec,nosuid
    environment:
      DATABASE_URL_FILE: /run/secrets/installer_database_url
    secrets:
      - installer_database_url
    command: ["alembic", "-c", "/app/alembic.ini", "upgrade", "head"]
    networks:
      - backend
    depends_on:
      postgres:
        condition: service_healthy

  minio:
    <<: *service-security
    image: ${GEO_MINIO_IMAGE:?set a digest-pinned GEO_MINIO_IMAGE}
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER_FILE: /run/secrets/minio_root_user
      MINIO_ROOT_PASSWORD_FILE: /run/secrets/minio_root_password
    secrets:
      - minio_root_user
      - minio_root_password
    volumes:
      - minio_data:/data
    networks:
      - backend
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 12
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 2G
          pids: 512

  minio-bootstrap:
    <<: *service-security
    image: ${GEO_MINIO_MC_IMAGE:?set a digest-pinned GEO_MINIO_MC_IMAGE}
    restart: "no"
    entrypoint: ["/bin/sh", "/bootstrap/bootstrap.sh"]
    environment:
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ROOT_USER_FILE: /run/secrets/minio_root_user
      MINIO_ROOT_PASSWORD_FILE: /run/secrets/minio_root_password
      OBJECT_STORE_BUCKET: geo-artifacts
      OBJECT_STORE_BACKUP_BUCKET: geo-backups
      OBJECT_STORE_ACCESS_KEY_FILE: /run/secrets/object_store_access_key
      OBJECT_STORE_SECRET_KEY_FILE: /run/secrets/object_store_secret_key
      OBJECT_STORE_BACKUP_ACCESS_KEY_FILE: /run/secrets/object_store_backup_access_key
      OBJECT_STORE_BACKUP_SECRET_KEY_FILE: /run/secrets/object_store_backup_secret_key
      OBJECT_STORE_RESTORE_ACCESS_KEY_FILE: /run/secrets/object_store_restore_access_key
      OBJECT_STORE_RESTORE_SECRET_KEY_FILE: /run/secrets/object_store_restore_secret_key
      OBJECT_STORE_RETENTION_ACCESS_KEY_FILE: /run/secrets/object_store_retention_access_key
      OBJECT_STORE_RETENTION_SECRET_KEY_FILE: /run/secrets/object_store_retention_secret_key
      GEO_WORKFLOW_C_ARTIFACT_OBJECT_STORE_BUCKET: geo-restricted-workflow-c-artifacts
      GEO_WORKFLOW_C_ARTIFACT_OBJECT_STORE_ACCESS_KEY_FILE: /run/secrets/workflow_c_artifact_object_store_access_key
      GEO_WORKFLOW_C_ARTIFACT_OBJECT_STORE_SECRET_KEY_FILE: /run/secrets/workflow_c_artifact_object_store_secret_key
      GEO_WORKFLOW_C_ARTIFACT_READER_ACCESS_KEY_FILE: /run/secrets/workflow_c_artifact_reader_access_key
      GEO_WORKFLOW_C_ARTIFACT_READER_SECRET_KEY_FILE: /run/secrets/workflow_c_artifact_reader_secret_key
      GEO_WORKFLOW_C_ARTIFACT_DELETER_ACCESS_KEY_FILE: /run/secrets/workflow_c_artifact_deleter_access_key
      GEO_WORKFLOW_C_ARTIFACT_DELETER_SECRET_KEY_FILE: /run/secrets/workflow_c_artifact_deleter_secret_key
      GEO_RECOMMENDATION_ARTIFACT_OBJECT_STORE_ACCESS_KEY_FILE: /run/secrets/recommendation_artifact_object_store_access_key
      GEO_RECOMMENDATION_ARTIFACT_OBJECT_STORE_SECRET_KEY_FILE: /run/secrets/recommendation_artifact_object_store_secret_key
      GEO_RECOMMENDATION_ARTIFACT_DELETER_ACCESS_KEY_FILE: /run/secrets/recommendation_artifact_deleter_access_key
      GEO_RECOMMENDATION_ARTIFACT_DELETER_SECRET_KEY_FILE: /run/secrets/recommendation_artifact_deleter_secret_key
      GEO_SYNTHETIC_STYLE_RAW_OBJECT_STORE_BUCKET: geo-synthetic-style-raw
      GEO_SYNTHETIC_STYLE_DERIVED_OBJECT_STORE_BUCKET: geo-synthetic-style-derived
      GEO_SYNTHETIC_STYLE_ARTIFACT_WRITER_ACCESS_KEY_FILE: /run/secrets/synthetic_style_artifact_writer_access_key
      GEO_SYNTHETIC_STYLE_ARTIFACT_WRITER_SECRET_KEY_FILE: /run/secrets/synthetic_style_artifact_writer_secret_key
      GEO_SYNTHETIC_ARTIFACT_DELETER_ACCESS_KEY_FILE: /run/secrets/synthetic_artifact_deleter_access_key
      GEO_SYNTHETIC_ARTIFACT_DELETER_SECRET_KEY_FILE: /run/secrets/synthetic_artifact_deleter_secret_key
      MINIO_BOOTSTRAP_ENABLE_EPHEMERAL: "0"
      MINIO_POLICY_VERSION: geo-object-store-policy-v1
    secrets:
      - minio_root_user
      - minio_root_password
      - object_store_access_key
      - object_store_secret_key
      - object_store_backup_access_key
      - object_store_backup_secret_key
      - object_store_restore_access_key
      - object_store_restore_secret_key
      - object_store_retention_access_key
      - object_store_retention_secret_key
      - workflow_c_artifact_object_store_access_key
      - workflow_c_artifact_object_store_secret_key
      - workflow_c_artifact_reader_access_key
      - workflow_c_artifact_reader_secret_key
      - workflow_c_artifact_deleter_access_key
      - workflow_c_artifact_deleter_secret_key
      - recommendation_artifact_object_store_access_key
      - recommendation_artifact_object_store_secret_key
      - recommendation_artifact_deleter_access_key
      - recommendation_artifact_deleter_secret_key
      - synthetic_style_artifact_writer_access_key
      - synthetic_style_artifact_writer_secret_key
      - synthetic_artifact_deleter_access_key
      - synthetic_artifact_deleter_secret_key
    volumes:
      - ./minio:/bootstrap:ro
    networks:
      - backend
    depends_on:
      minio:
        condition: service_healthy

  valkey:
    <<: *service-security
    image: ${GEO_VALKEY_IMAGE:?set a digest-pinned GEO_VALKEY_IMAGE}
    command: ["valkey-server", "--appendonly", "yes", "--save", "60", "1000"]
    volumes:
      - valkey_data:/data
    networks:
      - backend
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 12
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
          pids: 512

  alert-smtp-relay:
    <<: *service-security
    image: ${GEO_API_IMAGE:?set a digest-pinned GEO_API_IMAGE}
    read_only: true
    tmpfs:
      - /tmp:size=32m,noexec,nosuid
    environment:
      GEO_RELEASE_COMMIT: ${GEO_RELEASE_COMMIT:?set the current 40-character Git commit}
      GEO_ALERT_SMTP_UPSTREAM_HOST: ${GEO_ALERT_SMTP_UPSTREAM_HOST:?set GEO_ALERT_SMTP_UPSTREAM_HOST}
      GEO_ALERT_SMTP_UPSTREAM_ALLOWED_HOSTS: ${GEO_ALERT_SMTP_UPSTREAM_ALLOWED_HOSTS:?set GEO_ALERT_SMTP_UPSTREAM_ALLOWED_HOSTS}
      GEO_ALERT_SMTP_UPSTREAM_PORT: ${GEO_ALERT_SMTP_UPSTREAM_PORT:-587}
      GEO_ALERT_SMTP_TLS_MODE: ${GEO_ALERT_SMTP_TLS_MODE:-starttls}
      GEO_ALERT_SMTP_USERNAME_FILE: /run/secrets/alert_smtp_username
      GEO_ALERT_SMTP_PASSWORD_FILE: /run/secrets/alert_smtp_password
      GEO_ALERT_SMTP_SENDER: ${GEO_ALERT_SMTP_SENDER:?set GEO_ALERT_SMTP_SENDER}
      GEO_ALERT_SMTP_RECIPIENTS: ${GEO_ALERT_SMTP_RECIPIENTS:?set GEO_ALERT_SMTP_RECIPIENTS}
      GEO_ALERT_SMTP_RELAY_PORT: "8025"
    secrets:
      - alert_smtp_username
      - alert_smtp_password
    command: ["python", "-m", "geo_alert_smtp_relay"]
    networks:
      - backend
      - egress
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('localhost', 8025), timeout=3).close()"]
      interval: 10s
      timeout: 5s
      retries: 6
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256M
          pids: 512

  internal-api:
    <<: *service-security
    image: ${GEO_API_IMAGE:?set a digest-pinned GEO_API_IMAGE}
    read_only: true
    tmpfs:
      - /tmp:size=256m,noexec,nosuid
    environment:
      <<: *internal-api-environment
    secrets: *internal-api-secrets
    command: ["uvicorn", "geo_api.internal_app:app", "--host", "0.0.0.0", "--port", "8000"]
    networks:
      - backend
      - egress
    depends_on: *internal-dependencies
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready', timeout=5).read()"]
      interval: 10s
      timeout: 5s
      retries: 12
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
          pids: 512

  customer-api:
    <<: *service-security
    image: ${GEO_API_IMAGE:?set a digest-pinned GEO_API_IMAGE}
    read_only: true
    tmpfs:
      - /tmp:size=256m,noexec,nosuid
    environment:
      <<: *customer-api-environment
    secrets: *customer-api-secrets
    command: ["uvicorn", "geo_api.customer_app:app", "--host", "0.0.0.0", "--port", "8000"]
    networks:
      - backend
    depends_on: *customer-dependencies
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready', timeout=5).read()"]
      interval: 10s
      timeout: 5s
      retries: 12
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
          pids: 512

  task-worker:
    <<: *service-security
    image: ${GEO_API_IMAGE:?set a digest-pinned GEO_API_IMAGE}
    read_only: true
    tmpfs:
      - /tmp:size=512m,noexec,nosuid
    environment:
      GEO_DEPLOYMENT_ENVIRONMENT: production
      GEO_RELEASE_VERSION: ${GEO_RELEASE_VERSION:?set GEO_RELEASE_VERSION}
      GEO_RELEASE_COMMIT: ${GEO_RELEASE_COMMIT:?set the current 40-character Git commit}
      GEO_DATABASE_URL_FILE: /run/secrets/worker_database_url
      GEO_TASK_QUEUE_BROKER_URL: redis://valkey:6379/0
      GEO_RUNTIME_HEARTBEAT_INTERVAL_SECONDS: ${GEO_RUNTIME_HEARTBEAT_INTERVAL_SECONDS:-10}
      GEO_RUNTIME_HEARTBEAT_STALE_SECONDS: ${GEO_RUNTIME_HEARTBEAT_STALE_SECONDS:-30}
      GEO_RUNTIME_QUEUED_STALE_SECONDS: ${GEO_RUNTIME_QUEUED_STALE_SECONDS:-600}
      GEO_RUNTIME_OUTBOX_STALE_SECONDS: ${GEO_RUNTIME_OUTBOX_STALE_SECONDS:-300}
      GEO_RUNTIME_RUNNING_GRACE_SECONDS: ${GEO_RUNTIME_RUNNING_GRACE_SECONDS:-60}
      GEO_RUNTIME_FAILURE_WINDOW_SECONDS: ${GEO_RUNTIME_FAILURE_WINDOW_SECONDS:-86400}
      GEO_RUNTIME_EXPECTED_TASK_WORKER_INSTANCES: ${GEO_RUNTIME_EXPECTED_TASK_WORKER_INSTANCES:-4}
      GEO_MODEL_GATEWAY_WORKER_SERVICE_IDENTITY_ID: ${GEO_MODEL_GATEWAY_WORKER_SERVICE_IDENTITY_ID:?set GEO_MODEL_GATEWAY_WORKER_SERVICE_IDENTITY_ID}
      GEO_DEEPSEEK_API_KEY_FILE: /run/secrets/deepseek_api_key
      GEO_SECRET_STORE_MASTER_KEYRING_FILE: /run/secrets/secret_store_master_keyring
      GEO_SECRET_STORE_REQUEST_HASH_KEY_FILE: /run/secrets/secret_store_request_hash_key
      GEO_PROVIDER_ARTIFACT_KEYRING_FILE: /run/secrets/provider_artifact_keyring
      GEO_SYNTHETIC_ARTIFACT_KEYRING_FILE: /run/secrets/synthetic_artifact_keyring
      GEO_RECOMMENDATION_ARTIFACT_KEYRING_FILE: /run/secrets/recommendation_artifact_keyring
      GEO_RECOMMENDATION_ARTIFACT_OBJECT_STORE_ENDPOINT: http://minio:9000
      GEO_RECOMMENDATION_ARTIFACT_OBJECT_STORE_BUCKET: geo-restricted-recommendation-artifacts
      GEO_RECOMMENDATION_ARTIFACT_OBJECT_STORE_ACCESS_KEY_FILE: /run/secrets/recommendation_artifact_object_store_access_key
      GEO_RECOMMENDATION_ARTIFACT_OBJECT_STORE_SECRET_KEY_FILE: /run/secrets/recommendation_artifact_object_store_secret_key
      GEO_RECOMMENDATION_ARTIFACT_OBJECT_STORE_REGION: ${GEO_OBJECT_STORE_REGION:-us-east-1}
      GEO_WORKFLOW_C_ARTIFACT_KEYRING_FILE: /run/secrets/workflow_c_artifact_keyring
      GEO_WORKFLOW_C_ARTIFACT_READER_ENDPOINT: http://minio:9000
      GEO_WORKFLOW_C_ARTIFACT_READER_BUCKET: geo-restricted-workflow-c-artifacts
      GEO_WORKFLOW_C_ARTIFACT_READER_ACCESS_KEY_FILE: /run/secrets/workflow_c_artifact_reader_access_key
      GEO_WORKFLOW_C_ARTIFACT_READER_SECRET_KEY_FILE: /run/secrets/workflow_c_artifact_reader_secret_key
      GEO_WORKFLOW_C_ARTIFACT_READER_REGION: ${GEO_OBJECT_STORE_REGION:-us-east-1}
      GEO_ALERT_SMTP_HOST: alert-smtp-relay
      GEO_ALERT_SMTP_PORT: "8025"
      GEO_ALERT_SMTP_SENDER: ${GEO_ALERT_SMTP_SENDER:?set GEO_ALERT_SMTP_SENDER}
      GEO_ALERT_SMTP_RECIPIENTS: ${GEO_ALERT_SMTP_RECIPIENTS:?set GEO_ALERT_SMTP_RECIPIENTS}
      GEO_ALERT_WEBHOOK_ENDPOINT: ${GEO_ALERT_WEBHOOK_ENDPOINT:?set GEO_ALERT_WEBHOOK_ENDPOINT}
      GEO_ALERT_WEBHOOK_ALLOWED_HOSTS: ${GEO_ALERT_WEBHOOK_ALLOWED_HOSTS:?set GEO_ALERT_WEBHOOK_ALLOWED_HOSTS}
      GEO_ALERT_WEBHOOK_SIGNING_SECRET_FILE: /run/secrets/alert_webhook_signing_secret
      OBJECT_STORE_ENDPOINT: http://minio:9000
      OBJECT_STORE_BUCKET: geo-artifacts
      OBJECT_STORE_REGION: ${GEO_OBJECT_STORE_REGION:-us-east-1}
      OBJECT_STORE_ACCESS_KEY_FILE: /run/secrets/object_store_access_key
      OBJECT_STORE_SECRET_KEY_FILE: /run/secrets/object_store_secret_key
      OBJECT_STORE_AUTO_CREATE_BUCKET: "0"
      OTEL_SERVICE_NAME: geo-task-worker
    secrets:
      - worker_database_url
      - deepseek_api_key
      - object_store_access_key
      - object_store_secret_key
      - secret_store_master_keyring
      - secret_store_request_hash_key
      - provider_artifact_keyring
      - synthetic_artifact_keyring
      - recommendation_artifact_keyring
      - recommendation_artifact_object_store_access_key
      - recommendation_artifact_object_store_secret_key
      - workflow_c_artifact_keyring
      - workflow_c_artifact_reader_access_key
      - workflow_c_artifact_reader_secret_key
      - alert_webhook_signing_secret
    command: ["dramatiq", "geo_worker.tasks", "--processes", "${GEO_RUNTIME_EXPECTED_TASK_WORKER_INSTANCES:-4}", "--threads", "4"]
    networks:
      - backend
      - egress
    depends_on:
      migrate:
        condition: service_completed_successfully
      minio-bootstrap:
        condition: service_completed_successfully
      valkey:
        condition: service_healthy
      alert-smtp-relay:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-m", "geo_worker.runtime_health", "heartbeat", "--service-type", "task_worker"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "4.0"
          memory: 8G
          pids: 512

  workflow-c-maintenance-scheduler:
    <<: *service-security
    image: ${GEO_API_IMAGE:?set a digest-pinned GEO_API_IMAGE}
    read_only: true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid
    environment:
      GEO_DEPLOYMENT_ENVIRONMENT: production
      GEO_RELEASE_VERSION: ${GEO_RELEASE_VERSION:?set GEO_RELEASE_VERSION}
      GEO_RELEASE_COMMIT: ${GEO_RELEASE_COMMIT:?set the current 40-character Git commit}
      GEO_DATABASE_URL_FILE: /run/secrets/worker_database_url
      GEO_TASK_QUEUE_BROKER_URL: redis://valkey:6379/0
      GEO_RUNTIME_HEARTBEAT_INTERVAL_SECONDS: ${GEO_RUNTIME_HEARTBEAT_INTERVAL_SECONDS:-10}
      GEO_RUNTIME_HEARTBEAT_STALE_SECONDS: ${GEO_RUNTIME_HEARTBEAT_STALE_SECONDS:-30}
      GEO_RUNTIME_QUEUED_STALE_SECONDS: ${GEO_RUNTIME_QUEUED_STALE_SECONDS:-600}
      GEO_RUNTIME_OUTBOX_STALE_SECONDS: ${GEO_RUNTIME_OUTBOX_STALE_SECONDS:-300}
      GEO_RUNTIME_RUNNING_GRACE_SECONDS: ${GEO_RUNTIME_RUNNING_GRACE_SECONDS:-60}
      GEO_RUNTIME_FAILURE_WINDOW_SECONDS: ${GEO_RUNTIME_FAILURE_WINDOW_SECONDS:-86400}
      GEO_RUNTIME_EXPECTED_WORKFLOW_C_MAINTENANCE_SCHEDULER_INSTANCES: ${GEO_RUNTIME_EXPECTED_WORKFLOW_C_MAINTENANCE_SCHEDULER_INSTANCES:-1}
      GEO_WORKFLOW_C_ARTIFACT_STAGED_GRACE_SECONDS: ${GEO_WORKFLOW_C_ARTIFACT_STAGED_GRACE_SECONDS:-900}
      GEO_WORKFLOW_C_ARTIFACT_MAINTENANCE_SCHEDULE_SECONDS: ${GEO_WORKFLOW_C_ARTIFACT_MAINTENANCE_SCHEDULE_SECONDS:-60}
      GEO_WORKFLOW_C_ARTIFACT_MAINTENANCE_SEED_BATCH_SIZE: ${GEO_WORKFLOW_C_ARTIFACT_MAINTENANCE_SEED_BATCH_SIZE:-100}
      OTEL_SERVICE_NAME: geo-workflow-c-maintenance-scheduler
    secrets:
      - worker_database_url
    command: ["python", "-m", "geo_worker.workflow_c_maintenance_scheduler"]
    healthcheck:
      test: ["CMD", "python", "-m", "geo_worker.runtime_health", "heartbeat", "--service-type", "workflow_c_maintenance_scheduler"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - backend
    depends_on:
      migrate:
        condition: service_completed_successfully
