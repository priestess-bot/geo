name: geo-development

x-api-environment: &api-environment
  GEO_DEPLOYMENT_ENVIRONMENT: development
  GEO_AUTH_MODE: development
  GEO_AUTH_TOKEN_SECRET: geo-development-auth-token-secret-change-me
  GEO_DEV_TOOLS_ENABLED: ${GEO_DEV_TOOLS_ENABLED:-0}
  GEO_DB_POOL_ENABLED: "1"
  GEO_DATABASE_URL: postgresql://geo_app_dev:geo_app_dev@postgres:5432/geo
  DATABASE_URL: postgresql://geo_app_dev:geo_app_dev@postgres:5432/geo
  OBJECT_STORE_ENDPOINT: http://minio:9000
  OBJECT_STORE_BUCKET: geo-artifacts
  OBJECT_STORE_ACCESS_KEY: geo_dev
  OBJECT_STORE_SECRET_KEY: geo_dev_secret
  OBJECT_STORE_AUTO_CREATE_BUCKET: "1"
  GEO_TASK_QUEUE_ENABLED: "1"
  GEO_TASK_QUEUE_BROKER_URL: redis://valkey:6379/0

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: geo
      POSTGRES_USER: geo_installer
      POSTGRES_PASSWORD: geo_installer_dev
    ports:
      - "${GEO_POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U geo_installer -d geo"]
      interval: 5s
      timeout: 5s
      retries: 20

  migrate:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    environment:
      GEO_DATABASE_URL: postgresql://geo_installer:geo_installer_dev@postgres:5432/geo
      GEO_DEV_APP_PASSWORD: geo_app_dev
      GEO_DEV_WORKER_PASSWORD: geo_worker_dev
      GEO_DEV_BOOTSTRAP_ENABLED: "1"
      GEO_CONNECTOR_SERVICE_IDENTITY_ID: ${GEO_CONNECTOR_SERVICE_IDENTITY_ID:-40000000-0000-4000-8000-000000000004}
      GEO_BROWSER_CAPTURE_SERVICE_IDENTITY_ID: ${GEO_BROWSER_CAPTURE_SERVICE_IDENTITY_ID:-40000000-0000-4000-8000-000000000005}
    command:
      - /bin/sh
      - -c
      - alembic upgrade head && python scripts/provision_dev_database.py
    depends_on:
      postgres:
        condition: service_healthy

  minio:
    image: minio/minio:RELEASE.2025-01-20T14-49-07Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: geo_dev
      MINIO_ROOT_PASSWORD: geo_dev_secret
    ports:
      - "${GEO_MINIO_HOST_PORT:-9000}:9000"
      - "${GEO_MINIO_CONSOLE_HOST_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Readiness probes are deliberately side-effect free. Initialise every
  # governed artifact bucket before APIs and Workers start so a fresh volume
  # is ready without requiring an operator to create buckets manually.
  minio-init:
    image: minio/minio:RELEASE.2025-01-20T14-49-07Z
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        mc alias set geo http://minio:9000 geo_dev geo_dev_secret >/dev/null
        for bucket in \
          geo-artifacts \
          geo-restricted-recommendation-artifacts \
          geo-restricted-workflow-c-artifacts \
          geo-synthetic-style-raw \
          geo-synthetic-style-derived \
          geo-connector-raw \
          geo-browser-capture-raw
        do
          mc mb --ignore-existing "geo/$${bucket}" >/dev/null
        done
    depends_on:
      minio:
        condition: service_healthy

  valkey:
    image: valkey/valkey:8.0.2-alpine
    command: ["valkey-server", "--appendonly", "yes"]
    ports:
      - "${GEO_VALKEY_HOST_PORT:-6379}:6379"
    volumes:
      - valkey_data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  internal-api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    environment:
      <<: *api-environment
      GEO_OPENROUTER_API_KEY_FILE: /run/secrets/openrouter_key
      GEO_OPENROUTER_MODEL: ${GEO_OPENROUTER_MODEL:-openai/gpt-5.5}
      GEO_OPENROUTER_HTTP_REFERER: ${GEO_OPENROUTER_HTTP_REFERER:-https://geo.local}
      GEO_OPENROUTER_APP_TITLE: ${GEO_OPENROUTER_APP_TITLE:-GEO Search Demo}
      GEO_PERPLEXITY_MODEL: ${GEO_PERPLEXITY_MODEL:-perplexity/sonar}
    command: ["uvicorn", "geo_api.internal_app:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    ports:
      - "${GEO_INTERNAL_API_HOST_PORT:-8000}:8000"
    volumes:
      - ../apps/api:/app/apps/api
      - ../packages/geo_core:/app/packages/geo_core
      - ../prompt:/app/prompt:ro
      - ${GEO_OPENROUTER_API_KEY_FILE:-../openrouter_key.txt}:/run/secrets/openrouter_key:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
      valkey:
        condition: service_healthy

  customer-api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    environment:
      <<: *api-environment
      GEO_AUTH_MODE: session
    command: ["uvicorn", "geo_api.customer_app:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    ports:
      - "${GEO_CUSTOMER_API_HOST_PORT:-8001}:8000"
    volumes:
      - ../apps/api:/app/apps/api
      - ../packages/geo_core:/app/packages/geo_core
      - ../prompt:/app/prompt:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
      valkey:
        condition: service_healthy

  task-worker:
    profiles: ["workers"]
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    user: "${GEO_DEV_HOST_UID:-1000}:${GEO_DEV_HOST_GID:-1000}"
    environment:
      <<: *api-environment
      GEO_DATABASE_URL: postgresql://geo_worker_dev:geo_worker_dev@postgres:5432/geo
      DATABASE_URL: postgresql://geo_worker_dev:geo_worker_dev@postgres:5432/geo
      GEO_DEEPSEEK_API_KEY_FILE: /run/secrets/deepseek_api_key
    command: ["dramatiq", "geo_worker.tasks", "--processes", "1", "--threads", "4"]
    volumes:
      - ../apps/api:/app/apps/api
      - ../packages/geo_core:/app/packages/geo_core
      - ../prompt:/app/prompt:ro
      - ${GEO_DEEPSEEK_API_KEY_FILE:-../deepseek_api_key.txt}:/run/secrets/deepseek_api_key:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
      valkey:
        condition: service_healthy

  connector-worker:
    profiles: ["connectors"]
    build:
      context: ..
      dockerfile: apps/connector_worker/Dockerfile
    environment:
      GEO_DEPLOYMENT_ENVIRONMENT: development
      GEO_RELEASE_COMMIT: ${GEO_RELEASE_COMMIT:-0000000000000000000000000000000000000000}
      GEO_DATABASE_URL: postgresql://geo_worker_dev:geo_worker_dev@postgres:5432/geo
      GEO_TASK_QUEUE_BROKER_URL: redis://valkey:6379/0
      GEO_CONNECTOR_SERVICE_IDENTITY_ID: ${GEO_CONNECTOR_SERVICE_IDENTITY_ID:-40000000-0000-4000-8000-000000000004}
      GEO_SECRET_STORE_MASTER_KEYRING_FILE: /run/secrets/secret_store_master_keyring
      GEO_SECRET_STORE_REQUEST_HASH_KEY_FILE: /run/secrets/secret_store_request_hash_key
      GEO_CONNECTOR_ARTIFACT_KEY_FILE: /run/secrets/connector_artifact_key
      GEO_CONNECTOR_ARTIFACT_KEY_REFERENCE: ${GEO_CONNECTOR_ARTIFACT_KEY_REFERENCE:-connector-artifact:v1}
      GEO_CONNECTOR_ARTIFACT_OBJECT_STORE_ENDPOINT: http://minio:9000
      GEO_CONNECTOR_ARTIFACT_OBJECT_STORE_BUCKET: geo-connector-raw
      GEO_CONNECTOR_ARTIFACT_OBJECT_STORE_ACCESS_KEY: geo_dev
      GEO_CONNECTOR_ARTIFACT_OBJECT_STORE_SECRET_KEY: geo_dev_secret
      GEO_CONNECTOR_ARTIFACT_OBJECT_STORE_AUTO_CREATE_BUCKET: "0"
    volumes:
      - ${GEO_SECRET_STORE_MASTER_KEYRING_FILE:-../.secrets/secret-store-master-keyring.json}:/run/secrets/secret_store_master_keyring:ro
      - ${GEO_SECRET_STORE_REQUEST_HASH_KEY_FILE:-../.secrets/secret-store-request-hash-key}:/run/secrets/secret_store_request_hash_key:ro
      - ${GEO_CONNECTOR_ARTIFACT_KEY_FILE:-../.secrets/connector-artifact-key}:/run/secrets/connector_artifact_key:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
      valkey:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "from pathlib import Path; assert b'dramatiq' in Path('/proc/1/cmdline').read_bytes() and Path('/tmp/geo-worker-ready').is_file()"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 15s

  browser-capture-worker:
    profiles: ["browser-capture"]
    build:
      context: ..
      dockerfile: apps/browser_capture_worker/Dockerfile
    user: "10001:10001"
    read_only: true
    tmpfs:
      - /tmp:size=512m,nosuid
    environment:
      GEO_DEPLOYMENT_ENVIRONMENT: development
      GEO_RELEASE_COMMIT: ${GEO_RELEASE_COMMIT:-0000000000000000000000000000000000000000}
      GEO_DATABASE_URL: postgresql://geo_worker_dev:geo_worker_dev@postgres:5432/geo
      GEO_TASK_QUEUE_BROKER_URL: redis://valkey:6379/0
      GEO_BROWSER_CAPTURE_SERVICE_IDENTITY_ID: ${GEO_BROWSER_CAPTURE_SERVICE_IDENTITY_ID:-40000000-0000-4000-8000-000000000005}
      GEO_BROWSER_RUNTIME_RELEASE: ${GEO_BROWSER_RUNTIME_RELEASE:-playwright:1.60.0/chromium}
      GEO_SECRET_STORE_MASTER_KEYRING_FILE: /run/secrets/secret_store_master_keyring
      GEO_SECRET_STORE_REQUEST_HASH_KEY_FILE: /run/secrets/secret_store_request_hash_key
      GEO_BROWSER_ARTIFACT_KEY_FILE: /run/secrets/browser_artifact_key
      GEO_BROWSER_ARTIFACT_KEY_REFERENCE: ${GEO_BROWSER_ARTIFACT_KEY_REFERENCE:-browser-artifact:v1}
      GEO_BROWSER_ARTIFACT_OBJECT_STORE_ENDPOINT: http://minio:9000
      GEO_BROWSER_ARTIFACT_OBJECT_STORE_BUCKET: geo-browser-capture-raw
      GEO_BROWSER_ARTIFACT_OBJECT_STORE_ACCESS_KEY: geo_dev
      GEO_BROWSER_ARTIFACT_OBJECT_STORE_SECRET_KEY: geo_dev_secret
      GEO_BROWSER_ARTIFACT_OBJECT_STORE_AUTO_CREATE_BUCKET: "0"
      GEO_BROWSER_ARTIFACT_RETENTION_DAYS: ${GEO_BROWSER_ARTIFACT_RETENTION_DAYS:-30}
    volumes:
      - ${GEO_SECRET_STORE_MASTER_KEYRING_FILE:-../.secrets/secret-store-master-keyring.json}:/run/secrets/secret_store_master_keyring:ro
      - ${GEO_SECRET_STORE_REQUEST_HASH_KEY_FILE:-../.secrets/secret-store-request-hash-key}:/run/secrets/secret_store_request_hash_key:ro
      - ${GEO_BROWSER_ARTIFACT_KEY_FILE:-../.secrets/browser-artifact-key}:/run/secrets/browser_artifact_key:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
      valkey:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "from pathlib import Path; assert b'dramatiq' in Path('/proc/1/cmdline').read_bytes() and Path('/tmp/geo-worker-ready').is_file()"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 15s

  outbox-relay:
    profiles: ["workers"]
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    environment:
      GEO_DEPLOYMENT_ENVIRONMENT: development
      GEO_DATABASE_URL: postgresql://geo_worker_dev:geo_worker_dev@postgres:5432/geo
      GEO_TASK_QUEUE_BROKER_URL: redis://valkey:6379/0
    command: ["python", "-m", "geo_worker.relay"]
    volumes:
      - ../apps/api:/app/apps/api
      - ../packages/geo_core:/app/packages/geo_core
      - ../prompt:/app/prompt:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
      valkey:
        condition: service_healthy

  admin-web:
    build:
      context: ..
      dockerfile: apps/admin-web/Dockerfile
    environment:
      API_INTERNAL_BASE_URL: http://internal-api:8000
      GEO_DEPLOYMENT_ENVIRONMENT: development
      GEO_AUTH_MODE: development
      GEO_ADMIN_ACTOR_ID: 30000000-0000-4000-8000-000000000003
      GEO_ADMIN_TENANT_ID: 10000000-0000-4000-8000-000000000001
      NEXT_PUBLIC_CUSTOMER_WEB_BASE_URL: http://localhost:${GEO_CUSTOMER_WEB_HOST_PORT:-3000}
      PORT: "3000"
    ports:
      - "${GEO_ADMIN_WEB_HOST_PORT:-3001}:3000"
    depends_on:
      internal-api:
        condition: service_started

  customer-web:
    build:
      context: ..
      dockerfile: apps/customer-web/Dockerfile
    environment:
      API_CUSTOMER_BASE_URL: http://customer-api:8000
      GEO_DEPLOYMENT_ENVIRONMENT: development
      NEXT_PUBLIC_API_BASE_URL: http://localhost:${GEO_CUSTOMER_API_HOST_PORT:-8001}
      ADMIN_WEB_BASE_URL: http://localhost:${GEO_ADMIN_WEB_HOST_PORT:-3001}
      PORT: "3000"
    ports:
      - "${GEO_CUSTOMER_WEB_HOST_PORT:-3000}:3000"
    depends_on:
      customer-api:
        condition: service_started

volumes:
  postgres_data:
  minio_data:
  valkey_data:
