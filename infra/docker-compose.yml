services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: geno
      POSTGRES_USER: geno
      POSTGRES_PASSWORD: geno
    ports:
      - "${GENO_POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/migrations/up:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U geno -d geno"]
      interval: 5s
      timeout: 5s
      retries: 12

  db-migrate:
    image: pgvector/pgvector:pg16
    environment:
      PGPASSWORD: geno
    volumes:
      - ./db/migrations/up:/migrations/up:ro
    command:
      - /bin/sh
      - -c
      - |
        set -eu
        until psql -h postgres -U geno -d geno -tAc "SELECT 1" >/dev/null 2>&1; do
          sleep 1
        done
        # The official Postgres entrypoint briefly exposes its temporary init
        # server before restarting into the final server on a fresh volume.
        sleep 5
        until psql -h postgres -U geno -d geno -tAc "SELECT 1" >/dev/null 2>&1; do
          sleep 1
        done
        if [ "$(psql -h postgres -U geno -d geno -tAc "SELECT to_regprocedure('geno_runtime_can_access_project(uuid)') IS NOT NULL")" != "t" ]; then
          psql -h postgres -U geno -d geno -v ON_ERROR_STOP=1 -f /migrations/up/0010_runtime_project_rls.sql
        fi
        for file in \
          /migrations/up/0011_entity_alias_candidate_reviews.sql \
          /migrations/up/0012_entity_alias_candidate_review_assignments.sql \
          /migrations/up/0013_project_member_invitations.sql \
          /migrations/up/0014_project_member_invitation_acceptance.sql \
          /migrations/up/0015_customer_portal_launch_access_logs.sql \
          /migrations/up/0016_runtime_sessions.sql \
          /migrations/up/0017_tenant_membership_scope.sql \
          /migrations/up/0018_connector_secret_refs.sql \
          /migrations/up/0019_evidence_asset_metadata.sql \
          /migrations/up/0020_action_recommendation_contract.sql \
          /migrations/up/0021_knowledge_application.sql \
          /migrations/up/0022_score_profile_cleanup.sql \
          /migrations/up/0023_knowledge_pipeline_orchestration.sql \
          /migrations/up/0024_market_neutral_defaults.sql \
          /migrations/up/0025_global_auth_audit.sql \
          /migrations/up/0026_collection_jobs.sql \
          /migrations/up/0027_knowledge_pipeline_consolidation.sql \
          /migrations/up/0028_knowledge_pipeline_production_contract.sql \
          /migrations/up/0029_durable_job_lease_recovery.sql
        do
          psql -h postgres -U geno -d geno -v ON_ERROR_STOP=1 -f "$$file"
        done
    depends_on:
      postgres:
        condition: service_healthy

  minio:
    image: minio/minio:RELEASE.2025-01-20T14-49-07Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123
    ports:
      - "${GENO_MINIO_HOST_PORT:-9000}:9000"
      - "${GENO_MINIO_CONSOLE_HOST_PORT:-9001}:9001"
    volumes:
      - minio_data:/data

  minio-bootstrap:
    image: ${GENO_MINIO_MC_IMAGE:-minio/mc:RELEASE.2025-02-21T16-00-46Z}
    entrypoint:
      - /bin/sh
      - /bootstrap/bootstrap.sh
    environment:
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minio123}
      OBJECT_STORE_BUCKET: geno-reports
      OBJECT_STORE_BACKUP_BUCKET: geno-backups
      OBJECT_STORE_ACCESS_KEY: ${OBJECT_STORE_ACCESS_KEY:-geno-application-local}
      OBJECT_STORE_SECRET_KEY: ${OBJECT_STORE_SECRET_KEY:-geno-application-local-secret}
      OBJECT_STORE_BACKUP_ACCESS_KEY: ${OBJECT_STORE_BACKUP_ACCESS_KEY:-geno-backup-local}
      OBJECT_STORE_BACKUP_SECRET_KEY: ${OBJECT_STORE_BACKUP_SECRET_KEY:-geno-backup-local-secret}
      OBJECT_STORE_RESTORE_ACCESS_KEY: ${OBJECT_STORE_RESTORE_ACCESS_KEY:-geno-restore-local}
      OBJECT_STORE_RESTORE_SECRET_KEY: ${OBJECT_STORE_RESTORE_SECRET_KEY:-geno-restore-local-secret}
      OBJECT_STORE_RETENTION_ACCESS_KEY: ${OBJECT_STORE_RETENTION_ACCESS_KEY:-geno-retention-local}
      OBJECT_STORE_RETENTION_SECRET_KEY: ${OBJECT_STORE_RETENTION_SECRET_KEY:-geno-retention-local-secret}
      OBJECT_STORE_BACKUP_PREFIX: ${OBJECT_STORE_BACKUP_PREFIX:-production/local/}
      OBJECT_STORE_BACKUP_SMOKE_PREFIX: ${OBJECT_STORE_BACKUP_SMOKE_PREFIX:-smoke/local/}
      OBJECT_STORE_RESTORE_PREFIX: ${OBJECT_STORE_RESTORE_PREFIX:-restore-smoke/local/}
      OBJECT_STORE_RETENTION_PREFIX: ${OBJECT_STORE_RETENTION_PREFIX:-retention-approved/local/}
      MINIO_BOOTSTRAP_ENABLE_EPHEMERAL: ${MINIO_BOOTSTRAP_ENABLE_EPHEMERAL:-1}
      MINIO_POLICY_VERSION: geno-object-store-policy-v1
    volumes:
      - ./minio:/bootstrap:ro
      - object_store_receipts:/receipts
    depends_on:
      minio:
        condition: service_started

  qdrant:
    image: qdrant/qdrant:v1.13.4
    ports:
      - "${GENO_QDRANT_HTTP_HOST_PORT:-6333}:6333"
      - "${GENO_QDRANT_GRPC_HOST_PORT:-6334}:6334"
    volumes:
      - qdrant_storage:/qdrant/storage

  valkey:
    image: valkey/valkey:8.0.2-alpine
    command:
      - valkey-server
      - --appendonly
      - "yes"
    volumes:
      - valkey_data:/data
    healthcheck:
      test:
        - CMD
        - valkey-cli
        - ping
      interval: 5s
      timeout: 3s
      retries: 20

  report-pdf-renderer:
    image: ${GENO_PDF_RENDERER_IMAGE:-geno-pdf-renderer:local}
    build:
      context: ..
      dockerfile: workers/report_export_worker/Dockerfile.renderer
    environment:
      GENO_DEPLOYMENT_ENVIRONMENT: ${GENO_DEPLOYMENT_ENVIRONMENT:-development}
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://localhost:8200/health', timeout=5).read()
      interval: 10s
      timeout: 5s
      retries: 12

  litellm:
    image: docker.litellm.ai/berriai/litellm:main-latest
    profiles:
      - llm-gateway
    command:
      - --config
      - /app/config.yaml
      - --port
      - "4000"
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-sk-geno-local}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    ports:
      - "${GENO_LITELLM_HOST_PORT:-4000}:4000"
    volumes:
      - ./litellm_config.yaml:/app/config.yaml:ro

  api:
    image: ${GENO_API_IMAGE:-geno-api:local}
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgresql://geno_runtime_app:geno_runtime_app@postgres:5432/geno
      GENO_RUNTIME_DB_POOL_ENABLED: ${GENO_RUNTIME_DB_POOL_ENABLED:-1}
      GENO_RUNTIME_DB_POOL_MAX_SIZE: ${GENO_RUNTIME_DB_POOL_MAX_SIZE:-10}
      GENO_RUNTIME_DB_POOL_TIMEOUT_SECONDS: ${GENO_RUNTIME_DB_POOL_TIMEOUT_SECONDS:-5}
      OBJECT_STORE_ENDPOINT: http://minio:9000
      OBJECT_STORE_BUCKET: geno-reports
      OBJECT_STORE_ACCESS_KEY: minio
      OBJECT_STORE_SECRET_KEY: minio123
      OBJECT_STORE_REGION: us-east-1
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION: ${QDRANT_COLLECTION:-geo_knowledge_chunks_bge_m3_v1}
      KNOWLEDGE_EMBEDDING_API_URL: http://knowledge-embedding-api:8100
      GENO_PDF_RENDERER_URL: http://report-pdf-renderer:8200
      GENO_REPORT_PDF_RENDERER_REQUIRED: ${GENO_REPORT_PDF_RENDERER_REQUIRED:-1}
      GENO_TASK_QUEUE_ENABLED: ${GENO_TASK_QUEUE_ENABLED:-1}
      GENO_TASK_QUEUE_REQUIRED: ${GENO_TASK_QUEUE_REQUIRED:-1}
      GENO_TASK_QUEUE_BROKER_URL: redis://valkey:6379/0
      LITELLM_BASE_URL: http://litellm:4000
      LITELLM_API_KEY: ${LITELLM_MASTER_KEY:-sk-geno-local}
      GENO_CONNECTOR_SECRET_MASTER_KEY: ${GENO_CONNECTOR_SECRET_MASTER_KEY:-geno-local-connector-secret-master-key}
      GENO_RUNTIME_PROJECT_ACCESS_CONTROL: ${GENO_RUNTIME_PROJECT_ACCESS_CONTROL:-1}
      GENO_RUNTIME_AUTH_MODE: ${GENO_RUNTIME_AUTH_MODE:-header}
      GENO_RUNTIME_SESSION_COOKIE_SECURE: ${GENO_RUNTIME_SESSION_COOKIE_SECURE:-0}
      GENO_DEPLOYMENT_ENVIRONMENT: ${GENO_DEPLOYMENT_ENVIRONMENT:-development}
      GENO_DEV_TOOLS_ENABLED: ${GENO_DEV_TOOLS_ENABLED:-0}
      GENO_NOTIFICATION_EMAIL_PREFERENCE_BASE_URL: ${GENO_NOTIFICATION_EMAIL_PREFERENCE_BASE_URL:-}
      GENO_NOTIFICATION_EMAIL_PREFERENCE_TOKEN_SECRET: ${GENO_NOTIFICATION_EMAIL_PREFERENCE_TOKEN_SECRET:-}
      GENO_NOTIFICATION_EMAIL_PREFERENCE_TOKEN_TTL_SECONDS: ${GENO_NOTIFICATION_EMAIL_PREFERENCE_TOKEN_TTL_SECONDS:-2592000}
    command:
      - uvicorn
      - geno_api.main:app
      - --host
      - 0.0.0.0
      - --port
      - "${GENO_API_CONTAINER_PORT:-8000}"
    ports:
      - "${GENO_API_HOST_PORT:-8000}:${GENO_API_CONTAINER_PORT:-8000}"
    depends_on:
      db-migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
      qdrant:
        condition: service_started
      knowledge-embedding-api:
        condition: service_healthy
      report-pdf-renderer:
        condition: service_healthy
      valkey:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v3.0.1
    profiles:
      - observability
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    ports:
      - "${GENO_PROMETHEUS_HOST_PORT:-9090}:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      api:
        condition: service_started

  grafana:
    image: grafana/grafana:11.4.0
    profiles:
      - observability
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "${GENO_GRAFANA_HOST_PORT:-3001}:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      prometheus:
        condition: service_started

  ops-runtime-smoke:
    image: ${GENO_API_IMAGE:-geno-api:local}
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    profiles:
      - ops-smoke
    environment:
      GENO_OPS_SMOKE_API_BASE_URL: http://api:${GENO_API_CONTAINER_PORT:-8000}
      GENO_OPS_SMOKE_PROMETHEUS_BASE_URL: http://prometheus:9090
      GENO_OPS_SMOKE_GRAFANA_BASE_URL: http://grafana:3000
    command:
      - python
      - scripts/run_ops_runtime_smoke.py
    depends_on:
      api:
        condition: service_started
      prometheus:
        condition: service_started
      grafana:
        condition: service_started

  collector-worker:
    image: ${GENO_API_IMAGE:-geno-api:local}
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    profiles:
      - worker
    environment:
      DATABASE_URL: postgresql://geno_runtime_app:geno_runtime_app@postgres:5432/geno
      OBJECT_STORE_ENDPOINT: http://minio:9000
      OBJECT_STORE_BUCKET: geno-reports
      OBJECT_STORE_ACCESS_KEY: minio
      OBJECT_STORE_SECRET_KEY: minio123
      OBJECT_STORE_REGION: us-east-1
      LITELLM_BASE_URL: http://litellm:4000
      LITELLM_API_KEY: ${LITELLM_MASTER_KEY:-sk-geno-local}
      GENO_RUNTIME_PROJECT_ACCESS_CONTROL: ${GENO_RUNTIME_PROJECT_ACCESS_CONTROL:-1}
    command:
      - python
      - workers/collector_worker/run_collection_slice.py
      - --mode
      - api
      - --prompt-limit
      - "1"
      - --persist
      - --persist-analysis
      - --require-ready-collectors
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started

  collector-worker-litellm:
    image: ${GENO_API_IMAGE:-geno-api:local}
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    profiles:
      - llm-gateway
    environment:
      DATABASE_URL: postgresql://geno_runtime_app:geno_runtime_app@postgres:5432/geno
      OBJECT_STORE_ENDPOINT: http://minio:9000
      OBJECT_STORE_BUCKET: geno-reports
      OBJECT_STORE_ACCESS_KEY: minio
      OBJECT_STORE_SECRET_KEY: minio123
      OBJECT_STORE_REGION: us-east-1
      LITELLM_BASE_URL: http://litellm:4000
      LITELLM_API_KEY: ${LITELLM_MASTER_KEY:-sk-geno-local}
    command:
      - python
      - workers/collector_worker/run_collection_slice.py
      - --mode
      - api
      - --prompt-limit
      - "1"
      - --persist
      - --persist-analysis
      - --require-ready-collectors
      - --judge-gateway
      - litellm
      - --judge-model
      - geno-gpt-4.1-mini
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
      litellm:
        condition: service_started

  browser-fidelity-scheduler:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    profiles:
      - scheduler
    environment:
      DATABASE_URL: postgresql://geno_runtime_app:geno_runtime_app@postgres:5432/geno
      OBJECT_STORE_ENDPOINT: http://minio:9000
      OBJECT_STORE_BUCKET: geno-reports
      OBJECT_STORE_ACCESS_KEY: minio
      OBJECT_STORE_SECRET_KEY: minio123
      OBJECT_STORE_REGION: us-east-1
      PERPLEXITY_API_KEY: ${PERPLEXITY_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GENO_BROWSER_COLLECTOR_ENABLED: ${GENO_BROWSER_COLLECTOR_ENABLED:-0}
      GENO_BROWSER_START_URL: ${GENO_BROWSER_START_URL:-https://chatgpt.com/}
      GENO_BROWSER_PROMPT_SELECTOR: ${GENO_BROWSER_PROMPT_SELECTOR:-}
      GENO_BROWSER_ANSWER_SELECTOR: ${GENO_BROWSER_ANSWER_SELECTOR:-}
      GENO_BROWSER_SUBMIT_SELECTOR: ${GENO_BROWSER_SUBMIT_SELECTOR:-}
      GENO_BROWSER_CITATION_SELECTOR: ${GENO_BROWSER_CITATION_SELECTOR:-}
      GENO_BROWSER_STORAGE_STATE: ${GENO_BROWSER_STORAGE_STATE:-}
      GENO_BROWSER_ARTIFACT_DIR: ${GENO_BROWSER_ARTIFACT_DIR:-/tmp/geno-browser-artifacts}
      GENO_BROWSER_FIDELITY_EXECUTE: ${GENO_BROWSER_FIDELITY_EXECUTE:-0}
      GENO_BROWSER_FIDELITY_PERSIST_PLAN: ${GENO_BROWSER_FIDELITY_PERSIST_PLAN:-1}
      GENO_BROWSER_FIDELITY_PROMPT_COUNT: ${GENO_BROWSER_FIDELITY_PROMPT_COUNT:-10}
      GENO_BROWSER_FIDELITY_CITY_COUNT: ${GENO_BROWSER_FIDELITY_CITY_COUNT:-2}
      GENO_BROWSER_FIDELITY_SAMPLE_SIZE: ${GENO_BROWSER_FIDELITY_SAMPLE_SIZE:-1}
    command:
      - python
      - scripts/run_browser_fidelity_scheduler.py
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started

  runtime-alert-notification-worker:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    profiles:
      - scheduler
    environment:
      DATABASE_URL: postgresql://geno_runtime_app:geno_runtime_app@postgres:5432/geno
      GENO_RUNTIME_ALERT_MARKET_CODE: ${GENO_RUNTIME_ALERT_MARKET_CODE:-AU}
      GENO_RUNTIME_ALERT_MAX_PROJECTS: ${GENO_RUNTIME_ALERT_MAX_PROJECTS:-50}
    command:
      - python
      - workers/notification_worker/run_runtime_alert_notifications.py
      - --market-code
      - ${GENO_RUNTIME_ALERT_MARKET_CODE:-AU}
      - --max-projects
      - ${GENO_RUNTIME_ALERT_MAX_PROJECTS:-50}
    depends_on:
      postgres:
        condition: service_healthy

  runtime-alert-escalation-worker:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    profiles:
      - scheduler
    environment:
      DATABASE_URL: postgresql://geno_runtime_app:geno_runtime_app@postgres:5432/geno
      GENO_RUNTIME_ALERT_MARKET_CODE: ${GENO_RUNTIME_ALERT_MARKET_CODE:-AU}
      GENO_RUNTIME_ALERT_MAX_PROJECTS: ${GENO_RUNTIME_ALERT_MAX_PROJECTS:-50}
      GENO_RUNTIME_ALERT_ESCALATION_THRESHOLDS: ${GENO_RUNTIME_ALERT_ESCALATION_THRESHOLDS:-critical=4,high=24}
    command:
      - python
      - workers/notification_worker/run_runtime_alert_escalations.py
      - --market-code
      - ${GENO_RUNTIME_ALERT_MARKET_CODE:-AU}
      - --max-projects
      - ${GENO_RUNTIME_ALERT_MAX_PROJECTS:-50}
      - --severity-threshold-hours
      - ${GENO_RUNTIME_ALERT_ESCALATION_THRESHOLDS:-critical=4,high=24}
    depends_on:
      postgres:
        condition: service_healthy

  report-export-worker:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    profiles:
      - scheduler
    environment:
      DATABASE_URL: postgresql://geno_runtime_app:geno_runtime_app@postgres:5432/geno
      OBJECT_STORE_ENDPOINT: http://minio:9000
      OBJECT_STORE_BUCKET: geno-reports
      OBJECT_STORE_ACCESS_KEY: minio
      OBJECT_STORE_SECRET_KEY: minio123
      OBJECT_STORE_REGION: us-east-1
      GENO_REPORT_EXPORT_WORKER_MAX_JOBS: ${GENO_REPORT_EXPORT_WORKER_MAX_JOBS:-1}
      GENO_REPORT_EXPORT_WORKER_MAX_ATTEMPTS: ${GENO_REPORT_EXPORT_WORKER_MAX_ATTEMPTS:-3}
      GENO_REPORT_EXPORT_WORKER_RETRY_BACKOFF_SECONDS: ${GENO_REPORT_EXPORT_WORKER_RETRY_BACKOFF_SECONDS:-300}
      GENO_REPORT_EXPORT_WORKER_LEASE_SECONDS: ${GENO_REPORT_EXPORT_WORKER_LEASE_SECONDS:-900}
      GENO_PDF_RENDERER_URL: http://report-pdf-renderer:8200
      GENO_REPORT_PDF_RENDERER_REQUIRED: ${GENO_REPORT_PDF_RENDERER_REQUIRED:-1}
    command:
      - python
      - workers/report_export_worker/run_report_export_jobs.py
      - --max-jobs
      - ${GENO_REPORT_EXPORT_WORKER_MAX_JOBS:-1}
      - --max-attempts
      - ${GENO_REPORT_EXPORT_WORKER_MAX_ATTEMPTS:-3}
      - --retry-backoff-seconds
      - ${GENO_REPORT_EXPORT_WORKER_RETRY_BACKOFF_SECONDS:-300}
      - --lease-seconds
      - ${GENO_REPORT_EXPORT_WORKER_LEASE_SECONDS:-900}
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
      report-pdf-renderer:
        condition: service_healthy

  knowledge-worker:
    image: ${GENO_KNOWLEDGE_WORKER_IMAGE:-geno-knowledge-worker:local}
    build:
      context: ..
      dockerfile: workers/knowledge_worker/Dockerfile.heavy
    profiles:
      - knowledge
    environment:
      DATABASE_URL: postgresql://geno_runtime_app:geno_runtime_app@postgres:5432/geno
      OBJECT_STORE_ENDPOINT: http://minio:9000
      OBJECT_STORE_BUCKET: geno-reports
      OBJECT_STORE_ACCESS_KEY: minio
      OBJECT_STORE_SECRET_KEY: minio123
      OBJECT_STORE_REGION: us-east-1
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION: ${QDRANT_COLLECTION:-geo_knowledge_chunks_bge_m3_v1}
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      GEO_BGE_M3_MODEL: ${GEO_BGE_M3_MODEL:-/models/bge-m3-pytorch}
      GEO_KNOWLEDGE_COMPONENT_RUNNER: /app/scripts/run_knowledge_component.py
      GEO_ALLOW_CRAWLER_FALLBACK: ${GEO_ALLOW_CRAWLER_FALLBACK:-false}
      GENO_KNOWLEDGE_REQUIRE_REAL_MODEL: ${GENO_KNOWLEDGE_REQUIRE_REAL_MODEL:-true}
      GENO_KNOWLEDGE_REQUIRE_OBJECT_STORE: ${GENO_KNOWLEDGE_REQUIRE_OBJECT_STORE:-true}
      GENO_KNOWLEDGE_REQUIRE_QDRANT: ${GENO_KNOWLEDGE_REQUIRE_QDRANT:-true}
      GENO_DEEPSEEK_API_KEY_FILE: ${GENO_DEEPSEEK_API_KEY_FILE:-/run/secrets/deepseek_api_key}
      GENO_KNOWLEDGE_WORKER_MAX_JOBS: ${GENO_KNOWLEDGE_WORKER_MAX_JOBS:-1}
      GENO_KNOWLEDGE_WORKER_LEASE_SECONDS: ${GENO_KNOWLEDGE_WORKER_LEASE_SECONDS:-600}
      GENO_KNOWLEDGE_WORKER_POLL_SECONDS: ${GENO_KNOWLEDGE_WORKER_POLL_SECONDS:-2.0}
    command:
      - python
      - workers/knowledge_worker/run_knowledge_pipeline.py
      - --max-jobs
      - ${GENO_KNOWLEDGE_WORKER_MAX_JOBS:-1}
      - --lease-seconds
      - ${GENO_KNOWLEDGE_WORKER_LEASE_SECONDS:-600}
    volumes:
      - ../deepseek_api_key.txt:/run/secrets/deepseek_api_key:ro
      - ../.cache/models:/models:ro
    depends_on:
      postgres:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully
      minio:
        condition: service_started
      qdrant:
        condition: service_started

  knowledge-embedding-api:
    image: ${GENO_KNOWLEDGE_WORKER_IMAGE:-geno-knowledge-worker:local}
    build:
      context: ..
      dockerfile: workers/knowledge_worker/Dockerfile.heavy
    environment:
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      GEO_BGE_M3_MODEL: /models/bge-m3-pytorch
      GEO_KNOWLEDGE_COMPONENT_RUNNER: /app/scripts/run_knowledge_component.py
    command:
      - uvicorn
      - workers.knowledge_worker.embedding_api:app
      - --host
      - 0.0.0.0
      - --port
      - "8100"
    volumes:
      - ../.cache/models:/models:ro
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://localhost:8100/health', timeout=5).read()
      interval: 15s
