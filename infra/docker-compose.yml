  backup-postgres-smoke:
    image: pgvector/pgvector:pg16
    profiles:
      - backup-smoke
    environment:
      PGPASSWORD: geno
    command:
      - /bin/sh
      - -c
      - |
        set -eu
        restore_db="geno_restore_smoke"
        dump_path="/tmp/geno-backup-smoke.dump"
        trap 'dropdb -h postgres -U geno --if-exists "$$restore_db" >/dev/null 2>&1 || true' EXIT
        dropdb -h postgres -U geno --if-exists "$$restore_db"
        pg_dump -h postgres -U geno -d geno --format=custom --file="$$dump_path"
        createdb -h postgres -U geno "$$restore_db"
        pg_restore -h postgres -U geno -d "$$restore_db" --no-owner --no-privileges --exit-on-error "$$dump_path"
        source_tables="$$(psql -h postgres -U geno -d geno -tAc "SELECT count(*) FROM pg_tables WHERE schemaname = 'public'")"
        restored_tables="$$(psql -h postgres -U geno -d "$$restore_db" -tAc "SELECT count(*) FROM pg_tables WHERE schemaname = 'public'")"
        source_projects="$$(psql -h postgres -U geno -d geno -tAc "SELECT count(*) FROM projects")"
        restored_projects="$$(psql -h postgres -U geno -d "$$restore_db" -tAc "SELECT count(*) FROM projects")"
        test "$$source_tables" = "$$restored_tables"
        test "$$source_projects" = "$$restored_projects"
        test "$$(stat -c %s "$$dump_path")" -gt 0
        echo "postgres backup/restore smoke passed: tables=$$restored_tables projects=$$restored_projects sha256=$$(sha256sum "$$dump_path" | cut -d' ' -f1)"
    depends_on:
      db-migrate:
        condition: service_completed_successfully

