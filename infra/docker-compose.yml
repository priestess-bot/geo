      GENO_NOTIFICATION_WEBHOOK_SIGNING_SECRET_PREVIOUS: ${GENO_NOTIFICATION_WEBHOOK_SIGNING_SECRET_PREVIOUS:-}
      GENO_NOTIFICATION_SMTP_HOST: ${GENO_NOTIFICATION_SMTP_HOST:-}
      GENO_NOTIFICATION_SMTP_PORT: ${GENO_NOTIFICATION_SMTP_PORT:-587}
      GENO_NOTIFICATION_SMTP_TLS: ${GENO_NOTIFICATION_SMTP_TLS:-1}
      GENO_NOTIFICATION_SMTP_USERNAME: ${GENO_NOTIFICATION_SMTP_USERNAME:-}
      GENO_NOTIFICATION_SMTP_PASSWORD: ${GENO_NOTIFICATION_SMTP_PASSWORD:-}
      GENO_NOTIFICATION_SMTP_FROM: ${GENO_NOTIFICATION_SMTP_FROM:-}
      GENO_NOTIFICATION_SMTP_TIMEOUT_SECONDS: ${GENO_NOTIFICATION_SMTP_TIMEOUT_SECONDS:-10}
