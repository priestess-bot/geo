      GENO_BROWSER_COLLECTOR_ENABLED: ${GENO_BROWSER_COLLECTOR_ENABLED:-0}
      GENO_BROWSER_START_URL: ${GENO_BROWSER_START_URL:-https://chatgpt.com/}
      GENO_BROWSER_PROMPT_SELECTOR: ${GENO_BROWSER_PROMPT_SELECTOR:-}
      GENO_BROWSER_ANSWER_SELECTOR: ${GENO_BROWSER_ANSWER_SELECTOR:-}
