services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: geno
      POSTGRES_USER: geno
      POSTGRES_PASSWORD: geno
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/migrations/up:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U geno -d geno"]
      interval: 5s
      timeout: 5s
      retries: 12

  minio:
    image: minio/minio:RELEASE.2025-01-20T14-49-07Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgresql://geno:geno@postgres:5432/geno
      OBJECT_STORE_ENDPOINT: http://minio:9000
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started

  collector-worker:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    profiles:
      - worker
    environment:
      DATABASE_URL: postgresql://geno:geno@postgres:5432/geno
      OBJECT_STORE_ENDPOINT: http://minio:9000
    command:
      - python
      - workers/collector_worker/run_collection_slice.py
      - --mode
      - fixture
      - --prompt-limit
      - "1"
      - --persist
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_started

volumes:
  postgres_data:
  minio_data:
