name: geo-development

x-api-environment: &api-environment
  GEO_DEPLOYMENT_ENVIRONMENT: development
  GEO_AUTH_MODE: development
  GEO_AUTH_TOKEN_SECRET: geo-development-auth-token-secret-change-me
  GEO_DEV_TOOLS_ENABLED: ${GEO_DEV_TOOLS_ENABLED:-0}
  GEO_DB_POOL_ENABLED: "1"
  GEO_DATABASE_URL: postgresql://geo_app_dev:geo_app_dev@postgres:5432/geo
  DATABASE_URL: postgresql://geo_app_dev:geo_app_dev@postgres:5432/geo
  OBJECT_STORE_ENDPOINT: http://minio:9000
  OBJECT_STORE_BUCKET: geo-artifacts
  OBJECT_STORE_ACCESS_KEY: geo_dev
  OBJECT_STORE_SECRET_KEY: geo_dev_secret
  OBJECT_STORE_AUTO_CREATE_BUCKET: "1"
  GEO_TASK_QUEUE_ENABLED: "1"
  GEO_TASK_QUEUE_BROKER_URL: redis://valkey:6379/0

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: geo
      POSTGRES_USER: geo_installer
      POSTGRES_PASSWORD: geo_installer_dev
    ports:
      - "${GEO_POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U geo_installer -d geo"]
      interval: 5s
      timeout: 5s
      retries: 20

  migrate:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    environment:
      GEO_DATABASE_URL: postgresql://geo_installer:geo_installer_dev@postgres:5432/geo
      GEO_DEV_APP_PASSWORD: geo_app_dev
      GEO_DEV_WORKER_PASSWORD: geo_worker_dev
      GEO_DEV_BOOTSTRAP_ENABLED: "1"
    command:
      - /bin/sh
      - -c
      - alembic upgrade head && python scripts/provision_dev_database.py
    depends_on:
      postgres:
        condition: service_healthy

  minio:
    image: minio/minio:RELEASE.2025-01-20T14-49-07Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: geo_dev
      MINIO_ROOT_PASSWORD: geo_dev_secret
    ports:
      - "${GEO_MINIO_HOST_PORT:-9000}:9000"
      - "${GEO_MINIO_CONSOLE_HOST_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20

  valkey:
    image: valkey/valkey:8.0.2-alpine
    command: ["valkey-server", "--appendonly", "yes"]
    ports:
      - "${GEO_VALKEY_HOST_PORT:-6379}:6379"
    volumes:
      - valkey_data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  internal-api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    environment:
      <<: *api-environment
    command: ["uvicorn", "geo_api.internal_app:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    ports:
      - "${GEO_INTERNAL_API_HOST_PORT:-8000}:8000"
    volumes:
      - ../apps/api:/app/apps/api
      - ../packages/geo_core:/app/packages/geo_core
      - ../prompt:/app/prompt:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
      minio:
        condition: service_healthy
      valkey:
        condition: service_healthy

  customer-api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    environment:
      <<: *api-environment
      GEO_AUTH_MODE: session
    command: ["uvicorn", "geo_api.customer_app:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    ports:
      - "${GEO_CUSTOMER_API_HOST_PORT:-8001}:8000"
    volumes:
      - ../apps/api:/app/apps/api
      - ../packages/geo_core:/app/packages/geo_core
      - ../prompt:/app/prompt:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
      minio:
        condition: service_healthy
      valkey:
        condition: service_healthy

  task-worker:
    profiles: ["workers"]
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    user: "${GEO_DEV_HOST_UID:-1000}:${GEO_DEV_HOST_GID:-1000}"
    environment:
      <<: *api-environment
      GEO_DATABASE_URL: postgresql://geo_worker_dev:geo_worker_dev@postgres:5432/geo
      DATABASE_URL: postgresql://geo_worker_dev:geo_worker_dev@postgres:5432/geo
      GEO_DEEPSEEK_API_KEY_FILE: /run/secrets/deepseek_api_key
    command: ["dramatiq", "geo_worker.tasks", "--processes", "1", "--threads", "4"]
    volumes:
      - ../apps/api:/app/apps/api
      - ../packages/geo_core:/app/packages/geo_core
      - ../prompt:/app/prompt:ro
      - ${GEO_DEEPSEEK_API_KEY_FILE:-../deepseek_api_key.txt}:/run/secrets/deepseek_api_key:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
      valkey:
        condition: service_healthy

  outbox-relay:
    profiles: ["workers"]
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    environment:
      GEO_DEPLOYMENT_ENVIRONMENT: development
      GEO_DATABASE_URL: postgresql://geo_worker_dev:geo_worker_dev@postgres:5432/geo
      GEO_TASK_QUEUE_BROKER_URL: redis://valkey:6379/0
    command: ["python", "-m", "geo_worker.relay"]
    volumes:
      - ../apps/api:/app/apps/api
      - ../packages/geo_core:/app/packages/geo_core
      - ../prompt:/app/prompt:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
      valkey:
        condition: service_healthy

  admin-web:
    build:
      context: ..
      dockerfile: apps/admin-web/Dockerfile
    environment:
      API_INTERNAL_BASE_URL: http://internal-api:8000
      GEO_DEPLOYMENT_ENVIRONMENT: development
      GEO_AUTH_MODE: development
      GEO_ADMIN_ACTOR_ID: 30000000-0000-4000-8000-000000000003
      GEO_ADMIN_TENANT_ID: 10000000-0000-4000-8000-000000000001
      NEXT_PUBLIC_CUSTOMER_WEB_BASE_URL: http://localhost:${GEO_CUSTOMER_WEB_HOST_PORT:-3000}
      PORT: "3000"
    ports:
      - "${GEO_ADMIN_WEB_HOST_PORT:-3001}:3000"
    depends_on:
      internal-api:
        condition: service_started

  customer-web:
    build:
      context: ..
      dockerfile: apps/customer-web/Dockerfile
    environment:
      API_CUSTOMER_BASE_URL: http://customer-api:8000
      GEO_DEPLOYMENT_ENVIRONMENT: development
      NEXT_PUBLIC_API_BASE_URL: http://localhost:${GEO_CUSTOMER_API_HOST_PORT:-8001}
      ADMIN_WEB_BASE_URL: http://localhost:${GEO_ADMIN_WEB_HOST_PORT:-3001}
      PORT: "3000"
    ports:
      - "${GEO_CUSTOMER_WEB_HOST_PORT:-3000}:3000"
    depends_on:
      customer-api:
        condition: service_started

volumes:
  postgres_data:
  minio_data:
  valkey_data:
