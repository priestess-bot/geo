services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: geno
      POSTGRES_USER: geno
      POSTGRES_PASSWORD: geno
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/migrations/up:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U geno -d geno"]
      interval: 5s
      timeout: 5s
      retries: 12

  minio:
    image: minio/minio:RELEASE.2025-01-20T14-49-07Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  litellm:
    image: docker.litellm.ai/berriai/litellm:main-latest
    profiles:
      - llm-gateway
    command:
      - --config
      - /app/config.yaml
      - --port
      - "4000"
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-sk-geno-local}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    ports:
      - "4000:4000"
    volumes:
      - ./litellm_config.yaml:/app/config.yaml:ro

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgresql://geno_runtime_app:geno_runtime_app@postgres:5432/geno
      GENO_RUNTIME_DB_POOL_ENABLED: ${GENO_RUNTIME_DB_POOL_ENABLED:-1}
      GENO_RUNTIME_DB_POOL_MAX_SIZE: ${GENO_RUNTIME_DB_POOL_MAX_SIZE:-10}
      GENO_RUNTIME_DB_POOL_TIMEOUT_SECONDS: ${GENO_RUNTIME_DB_POOL_TIMEOUT_SECONDS:-5}
      OBJECT_STORE_ENDPOINT: http://minio:9000
      OBJECT_STORE_BUCKET: geno-reports
      OBJECT_STORE_ACCESS_KEY: minio
      OBJECT_STORE_SECRET_KEY: minio123
      OBJECT_STORE_REGION: us-east-1
      LITELLM_BASE_URL: http://litellm:4000
      LITELLM_API_KEY: ${LITELLM_MASTER_KEY:-sk-geno-local}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started

  prometheus:
    image: prom/prometheus:v3.0.1
    profiles:
      - observability
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      api:
        condition: service_started

  grafana:
    image: grafana/grafana:11.4.0
    profiles:
      - observability
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "3001:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      prometheus:
        condition: service_started

  collector-worker:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    profiles:
      - worker
    environment:
      DATABASE_URL: postgresql://geno_runtime_app:geno_runtime_app@postgres:5432/geno
      OBJECT_STORE_ENDPOINT: http://minio:9000
      OBJECT_STORE_BUCKET: geno-reports
      OBJECT_STORE_ACCESS_KEY: minio
      OBJECT_STORE_SECRET_KEY: minio123
      OBJECT_STORE_REGION: us-east-1
      LITELLM_BASE_URL: http://litellm:4000
      LITELLM_API_KEY: ${LITELLM_MASTER_KEY:-sk-geno-local}
    command:
      - python
      - workers/collector_worker/run_collection_slice.py
      - --mode
      - fixture
      - --prompt-limit
      - "1"
      - --persist
      - --persist-analysis
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started

  collector-worker-litellm:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    profiles:
      - llm-gateway
    environment:
      DATABASE_URL: postgresql://geno_runtime_app:geno_runtime_app@postgres:5432/geno
      OBJECT_STORE_ENDPOINT: http://minio:9000
      OBJECT_STORE_BUCKET: geno-reports
      OBJECT_STORE_ACCESS_KEY: minio
      OBJECT_STORE_SECRET_KEY: minio123
      OBJECT_STORE_REGION: us-east-1
      LITELLM_BASE_URL: http://litellm:4000
      LITELLM_API_KEY: ${LITELLM_MASTER_KEY:-sk-geno-local}
    command:
      - python
      - workers/collector_worker/run_collection_slice.py
      - --mode
      - fixture
      - --prompt-limit
      - "1"
      - --persist
      - --persist-analysis
      - --judge-gateway
      - litellm
      - --judge-model
      - geno-gpt-4.1-mini
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
      litellm:
        condition: service_started

  browser-fidelity-scheduler:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    profiles:
      - scheduler
    environment:
      DATABASE_URL: postgresql://geno_runtime_app:geno_runtime_app@postgres:5432/geno
      OBJECT_STORE_ENDPOINT: http://minio:9000
      OBJECT_STORE_BUCKET: geno-reports
      OBJECT_STORE_ACCESS_KEY: minio
      OBJECT_STORE_SECRET_KEY: minio123
      OBJECT_STORE_REGION: us-east-1
      PERPLEXITY_API_KEY: ${PERPLEXITY_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GENO_BROWSER_COLLECTOR_ENABLED: ${GENO_BROWSER_COLLECTOR_ENABLED:-0}
      GENO_BROWSER_START_URL: ${GENO_BROWSER_START_URL:-https://chatgpt.com/}
      GENO_BROWSER_PROMPT_SELECTOR: ${GENO_BROWSER_PROMPT_SELECTOR:-}
      GENO_BROWSER_ANSWER_SELECTOR: ${GENO_BROWSER_ANSWER_SELECTOR:-}
      GENO_BROWSER_SUBMIT_SELECTOR: ${GENO_BROWSER_SUBMIT_SELECTOR:-}
      GENO_BROWSER_CITATION_SELECTOR: ${GENO_BROWSER_CITATION_SELECTOR:-}
      GENO_BROWSER_STORAGE_STATE: ${GENO_BROWSER_STORAGE_STATE:-}
      GENO_BROWSER_ARTIFACT_DIR: ${GENO_BROWSER_ARTIFACT_DIR:-/tmp/geno-browser-artifacts}
      GENO_BROWSER_FIDELITY_EXECUTE: ${GENO_BROWSER_FIDELITY_EXECUTE:-0}
      GENO_BROWSER_FIDELITY_PERSIST_PLAN: ${GENO_BROWSER_FIDELITY_PERSIST_PLAN:-1}
      GENO_BROWSER_FIDELITY_PROMPT_COUNT: ${GENO_BROWSER_FIDELITY_PROMPT_COUNT:-10}
      GENO_BROWSER_FIDELITY_CITY_COUNT: ${GENO_BROWSER_FIDELITY_CITY_COUNT:-2}
      GENO_BROWSER_FIDELITY_SAMPLE_SIZE: ${GENO_BROWSER_FIDELITY_SAMPLE_SIZE:-1}
    command:
      - python
      - scripts/run_browser_fidelity_scheduler.py
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started

  runtime-alert-notification-worker:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    profiles:
      - scheduler
    environment:
      DATABASE_URL: postgresql://geno_runtime_app:geno_runtime_app@postgres:5432/geno
      GENO_RUNTIME_ALERT_MARKET_CODE: ${GENO_RUNTIME_ALERT_MARKET_CODE:-AU}
      GENO_RUNTIME_ALERT_MAX_PROJECTS: ${GENO_RUNTIME_ALERT_MAX_PROJECTS:-50}
    command:
      - python
      - workers/notification_worker/run_runtime_alert_notifications.py
      - --market-code
      - ${GENO_RUNTIME_ALERT_MARKET_CODE:-AU}
      - --max-projects
      - ${GENO_RUNTIME_ALERT_MAX_PROJECTS:-50}
    depends_on:
      postgres:
        condition: service_healthy

  runtime-alert-escalation-worker:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    profiles:
      - scheduler
    environment:
      DATABASE_URL: postgresql://geno_runtime_app:geno_runtime_app@postgres:5432/geno
      GENO_RUNTIME_ALERT_MARKET_CODE: ${GENO_RUNTIME_ALERT_MARKET_CODE:-AU}
      GENO_RUNTIME_ALERT_MAX_PROJECTS: ${GENO_RUNTIME_ALERT_MAX_PROJECTS:-50}
      GENO_RUNTIME_ALERT_ESCALATION_THRESHOLDS: ${GENO_RUNTIME_ALERT_ESCALATION_THRESHOLDS:-critical=4,high=24}
    command:
      - python
      - workers/notification_worker/run_runtime_alert_escalations.py
      - --market-code
      - ${GENO_RUNTIME_ALERT_MARKET_CODE:-AU}
      - --max-projects
      - ${GENO_RUNTIME_ALERT_MAX_PROJECTS:-50}
      - --severity-threshold-hours
      - ${GENO_RUNTIME_ALERT_ESCALATION_THRESHOLDS:-critical=4,high=24}
    depends_on:
      postgres:
        condition: service_healthy

  entity-alias-assignment-notification-worker:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    profiles:
      - scheduler
    environment:
      DATABASE_URL: postgresql://geno_runtime_app:geno_runtime_app@postgres:5432/geno
      GENO_ENTITY_ALIAS_ASSIGNMENT_MARKET_CODE: ${GENO_ENTITY_ALIAS_ASSIGNMENT_MARKET_CODE:-AU}
      GENO_ENTITY_ALIAS_ASSIGNMENT_MAX_PROJECTS: ${GENO_ENTITY_ALIAS_ASSIGNMENT_MAX_PROJECTS:-50}
    command:
      - python
      - workers/notification_worker/run_entity_alias_assignment_notifications.py
      - --market-code
      - ${GENO_ENTITY_ALIAS_ASSIGNMENT_MARKET_CODE:-AU}
      - --max-projects
      - ${GENO_ENTITY_ALIAS_ASSIGNMENT_MAX_PROJECTS:-50}
    depends_on:
      postgres:
        condition: service_healthy

  entity-alias-assignment-escalation-worker:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    profiles:
      - scheduler
    environment:
      DATABASE_URL: postgresql://geno_runtime_app:geno_runtime_app@postgres:5432/geno
      GENO_ENTITY_ALIAS_ASSIGNMENT_MARKET_CODE: ${GENO_ENTITY_ALIAS_ASSIGNMENT_MARKET_CODE:-AU}
      GENO_ENTITY_ALIAS_ASSIGNMENT_MAX_PROJECTS: ${GENO_ENTITY_ALIAS_ASSIGNMENT_MAX_PROJECTS:-50}
    command:
      - python
      - workers/notification_worker/run_entity_alias_assignment_escalations.py
      - --market-code
      - ${GENO_ENTITY_ALIAS_ASSIGNMENT_MARKET_CODE:-AU}
      - --max-projects
      - ${GENO_ENTITY_ALIAS_ASSIGNMENT_MAX_PROJECTS:-50}
    depends_on:
      postgres:
        condition: service_healthy

  runtime-e2e:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    profiles:
      - e2e
    environment:
      DATABASE_URL: postgresql://geno_runtime_app:geno_runtime_app@postgres:5432/geno
      OBJECT_STORE_ENDPOINT: http://minio:9000
      OBJECT_STORE_BUCKET: geno-reports
      OBJECT_STORE_ACCESS_KEY: minio
      OBJECT_STORE_SECRET_KEY: minio123
      OBJECT_STORE_REGION: us-east-1
    command:
      - python
      - scripts/verify_runtime_e2e.py
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started

  db-smoke:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    profiles:
      - db-smoke
    environment:
      DATABASE_URL: postgresql://geno:geno@postgres:5432/geno
      RUNTIME_DATABASE_URL: postgresql://geno_runtime_app:geno_runtime_app@postgres:5432/geno
    command:
      - python
      - scripts/verify_db_smoke.py
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    environment:
      API_INTERNAL_BASE_URL: http://api:8000
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_started

volumes:
  postgres_data:
  minio_data:
  prometheus_data:
  grafana_data:
