      GENO_BROWSER_FIDELITY_CITY_COUNT: ${GENO_BROWSER_FIDELITY_CITY_COUNT:-2}
      GENO_BROWSER_FIDELITY_SAMPLE_SIZE: ${GENO_BROWSER_FIDELITY_SAMPLE_SIZE:-1}
    command:
