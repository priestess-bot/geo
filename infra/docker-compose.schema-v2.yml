services:
  postgres-v2:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${SCHEMA_V2_POSTGRES_DB:-geno_v2}
      POSTGRES_USER: ${SCHEMA_V2_POSTGRES_USER:-geno_v2}
      POSTGRES_PASSWORD: ${SCHEMA_V2_POSTGRES_PASSWORD:-geno_v2_local}
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 2s
      timeout: 5s
      retries: 30
    volumes:
      - schema_v2_postgres_data:/var/lib/postgresql/data

  schema-v2-install:
    image: ${SCHEMA_V2_RUNNER_IMAGE:-geno-schema-v2-runner:local}
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    environment:
      SCHEMA_V2_DATABASE_URL: ${SCHEMA_V2_DATABASE_URL:-postgresql://geno_v2:geno_v2_local@postgres-v2:5432/geno_v2}
      GENO_APP_VERSION: ${GENO_APP_VERSION:-0.1.0}
      GENO_APP_COMMIT: ${GENO_APP_COMMIT:-development}
    command:
      - python
      - scripts/schema_v2_runner.py
      - install
      - --schema-root
      - /schema-v2
    volumes:
      - ./db/schema-v2:/schema-v2:ro
    depends_on:
      postgres-v2:
        condition: service_healthy

  schema-v2-verify:
    image: ${SCHEMA_V2_RUNNER_IMAGE:-geno-schema-v2-runner:local}
    environment:
      SCHEMA_V2_DATABASE_URL: ${SCHEMA_V2_DATABASE_URL:-postgresql://geno_v2:geno_v2_local@postgres-v2:5432/geno_v2}
      GENO_APP_VERSION: ${GENO_APP_VERSION:-0.1.0}
      GENO_APP_COMMIT: ${GENO_APP_COMMIT:-development}
    command:
      - python
      - scripts/schema_v2_runner.py
      - verify
      - --schema-root
      - /schema-v2
    volumes:
      - ./db/schema-v2:/schema-v2:ro
    depends_on:
      postgres-v2:
        condition: service_healthy

volumes:
  schema_v2_postgres_data:
